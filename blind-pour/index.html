<style>
  :root {

  #blind .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a434c; animation: pulse 1.2s infinite; }

  @media (max-width: 600px) { #hud { flex-direction: column; } #hint { white-space: normal; text-align: center; width: calc(100vw - 32px); } }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- units: 1 = 1 cm ----------
const WALL = 0.22, BASE = 0.9, BULGE_MAX = 0.25; // 表面張力で縁より盛り上がれる最大(cm, 近似)
const SOUND_C = 34300, GRAV = 981;
const GLASSES = [
  { name: 'タンブラー', H: 10, rt: 3.7, rb: 3.2 },
  { name: 'ハイボールグラス', H: 15, rt: 3.1, rb: 2.85 },
  { name: 'ロックグラス', H: 8.5, rt: 4.4, rb: 4.3 },
  { name: 'パイントグラス', H: 14.5, rt: 4.3, rb: 3.1 },
];

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#2a3340'); gr.addColorStop(0.55, '#1a2029'); gr.addColorStop(1, '#0b0e12');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 20, 55);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.enableDamping = true;
controls.minDistance = 12; controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 6, 0);

scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x2a1d12, 0.35));
const key = new THREE.DirectionalLight(0xfff1dd, 2.2);
key.position.set(14, 30, 12); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
scene.add(key);
const rim = new THREE.SpotLight(0x9fc8ff, 300, 80, 0.5, 0.6);
rim.position.set(-10, 18, -22); scene.add(rim);

// wood table
const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#5a3a22'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const y = Math.random() * h, a = 0.04 + Math.random() * 0.08;
    g.strokeStyle = Math.random() < 0.5 ? `rgba(30,16,6,${a})` : `rgba(140,96,60,${a})`;
    g.lineWidth = 1 + Math.random() * 4; g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.01 + i) * 6 + Math.sin(x * 0.003 + i * 2) * 10);
    g.stroke();
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(2, 2); woodTex.anisotropy = 8;
const table = new THREE.Mesh(new THREE.CircleGeometry(60, 64),
  new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.25 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

// contact shadow
const contact = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
  map: canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.position.y = 0.01; scene.add(contact);

// faucet / spout
const SPOUT_Y_OFFSET = 8;
const metal = new THREE.MeshPhysicalMaterial({ color: 0xd9dde2, metalness: 1, roughness: 0.18 });
let spout;
function buildSpout(H) {
  if (spout) { scene.remove(spout); spout.traverse(o => o.geometry && o.geometry.dispose()); }
  const top = H + SPOUT_Y_OFFSET;
  // 傾けた瓶（口が注ぎ口）
  const pts = [];
  const P = (x, y) => pts.push(new THREE.Vector2(Math.max(x, 0.001), y));
  P(0, 0); P(3.3, 0); P(3.6, 0.4); P(3.6, 15); P(3.2, 17); P(2.0, 19); P(1.25, 20.5); P(1.2, 26);
  P(1.45, 26.2); P(1.45, 27); P(1.0, 27.1); P(0.95, 26.0); P(0.95, 20.5); P(1.7, 19.2); P(3.0, 17.2);
  P(3.4, 15); P(3.4, 0.5); P(0, 0.5);
  const bottleMat = new THREE.MeshPhysicalMaterial({ color: 0xcfe8d6, metalness: 0, roughness: 0.02,
    transmission: 1, thickness: 0.5, ior: 1.5, attenuationColor: new THREE.Color(0x4f9a6a),
    attenuationDistance: 6, envMapIntensity: 1.3, side: THREE.DoubleSide });
  const bottle = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), bottleMat);
  bottle.position.y = -27.1; // 口を原点に
  spout = new THREE.Group(); spout.add(bottle);
  spout.rotation.z = -2.35; // 口を下向きに傾ける
  spout.scale.setScalar(0.75);
  spout.position.set(0, top, 0);
  scene.add(spout);
  return top;
}

// materials
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.0, transmission: 1, thickness: 0.35, ior: 1.5,
  envMapIntensity: 1.2, side: THREE.DoubleSide, specularIntensity: 1, depthWrite: false,
});
// 水: three.jsの透過はガラス越しに別の透過物を写さないので、
// 「背景を先に描いた画像」を屈折させて貼る不透明シェーダにする（→ガラス越しにも見える）
const bgRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const resUniform = { value: new THREE.Vector2(1, 1) };
function makeWaterMat(refract, rimBoost = 0.25) {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0x000000, metalness: 0, roughness: 0.0, ior: 1.333, specularIntensity: 1,
    envMapIntensity: 1.25, side: THREE.FrontSide,
  });
  m.onBeforeCompile = (s) => {
    s.uniforms.bgTex = { value: bgRT.texture };
    s.uniforms.res = resUniform;
    s.fragmentShader = 'uniform sampler2D bgTex;\nuniform vec2 res;\n' + s.fragmentShader.replace(
      '#include <opaque_fragment>',
      `{
        vec3 nV = normalize(normal);
        vec2 suv = gl_FragCoord.xy / res - nV.xy * ${refract.toFixed(3)};
        vec3 refr = texture2D(bgTex, clamp(suv, 0.002, 0.998)).rgb;
        float facing = clamp(abs(nV.z), 0.0, 1.0);
        vec3 tint = mix(vec3(0.70, 0.88, 0.96), vec3(0.88, 0.97, 1.0), facing);
        float edge = pow(1.0 - facing, 3.0);
        outgoingLight += refr * tint * mix(0.8, 1.02, facing) + vec3(0.55, 0.75, 0.85) * edge * ${rimBoost.toFixed(2)};
      }
      #include <opaque_fragment>`);
  };
  return m;
}
const waterMat = makeWaterMat(0.15, 0.4);
waterMat.envMapIntensity = 0.6;
const streamMat = makeWaterMat(0.06, 1.6);
streamMat.envMapIntensity = 2.5;

// ---------- glass + water geometry ----------
let G, glassMesh, waterMesh, streamMesh, sheetMesh, puddleMesh, spoutY;
const rIn = (y) => G.rbi + (G.rti - G.rbi) * THREE.MathUtils.clamp((y - BASE) / (G.H - BASE), 0, 1);

function glassProfile() {
  const { H, rt, rb, rti, rbi } = G;
  const pts = [];
  const push = (x, y) => pts.push(new THREE.Vector2(Math.max(x, 0.001), y));
  push(0, BASE); push(rbi - 0.25, BASE); push(rbi - 0.06, BASE + 0.05); push(rbi, BASE + 0.25);
  for (let i = 1; i <= 12; i++) { const y = BASE + 0.25 + (H - 0.1 - BASE - 0.25) * i / 12; push(rIn(y), y); }
  for (let i = 0; i <= 10; i++) { // rounded rim
    const a = Math.PI * (i / 10);
    push((rti + rt) / 2 - Math.cos(a) * (rt - rti) / 2, H - 0.1 + Math.sin(a) * 0.12);
  }
  for (let i = 1; i <= 12; i++) { const t = i / 12; push(rt + (rb - rt) * t, (H - 0.1) * (1 - t) + 0.25 * t); }
  push(rb - 0.08, 0.04); push(rb - 0.3, 0); push(0, 0);
  return pts;
}

function waterProfile(level, dome) {
  const pts = [];
  const push = (x, y) => pts.push(new THREE.Vector2(Math.max(x, 0.001), y));
  const b = BASE + 0.005;
  push(0, b); push(G.rbi - 0.26, b); push(G.rbi - 0.07, b + 0.05); push(G.rbi - 0.01, b + 0.25);
  const top = Math.min(level, G.H - 0.1);
  const n = 10;
  for (let i = 1; i <= n; i++) { const y = b + 0.25 + (top - b - 0.25) * i / n; if (y > b + 0.25) push(rIn(y) - 0.01, y); }
  if (dome > 0) { // 縁まで満ちて表面張力で盛り上がる
    const R = (G.rti + G.rt) / 2;
    push(R, G.H + 0.02);
    for (let i = 1; i <= 16; i++) {
      const t = i / 16, x = R * (1 - t);
      push(x, G.H + 0.02 + dome * Math.pow(1 - Math.pow(x / R, 6), 0.5));
    }
  } else {
    const r = rIn(top) - 0.01;
    push(r, top + 0.06); push(r - 0.08, top + 0.015); push(r - 0.25, top); push(0, top);
  }
  return pts;
}

function rebuildWater() {
  if (waterMesh) { scene.remove(waterMesh); waterMesh.geometry.dispose(); }
  if (state.level <= BASE + 0.02 && state.dome <= 0) { waterMesh = null; return; }
  waterMesh = new THREE.Mesh(new THREE.LatheGeometry(waterProfile(state.level, state.dome), 96), waterMat);
  waterMesh.renderOrder = 1; scene.add(waterMesh);
}

function setupGlass(idx) {
  const p = GLASSES[idx];
  G = { ...p, rti: p.rt - WALL, rbi: p.rb - WALL };
  if (glassMesh) { scene.remove(glassMesh); glassMesh.geometry.dispose(); }
  glassMesh = new THREE.Mesh(new THREE.LatheGeometry(glassProfile(), 128), glassMat);
  glassMesh.renderOrder = 2; scene.add(glassMesh);
  contact.scale.setScalar(p.rb * 2.9);
  spoutY = buildSpout(p.H);
  controls.target.set(0, p.H * 0.5 + 5, 0);
  if (!streamMesh) {
    streamMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.3, 1, 24, 1, true), streamMat);
    scene.add(streamMesh);
  }
  if (sheetMesh) { scene.remove(sheetMesh); sheetMesh.geometry.dispose(); }
  sheetMesh = new THREE.Mesh(new THREE.CylinderGeometry(p.rt + 0.03, p.rb + 0.03, p.H, 96, 1, true),
    new THREE.MeshPhysicalMaterial({ color: 0xcfefff, transparent: true, opacity: 0.0, roughness: 0.05,
      envMapIntensity: 1.5, depthWrite: false, side: THREE.DoubleSide }));
  sheetMesh.position.y = p.H / 2; scene.add(sheetMesh);
  if (!puddleMesh) {
    puddleMesh = new THREE.Mesh(new THREE.CircleGeometry(1, 64), streamMat);
    puddleMesh.rotation.x = -Math.PI / 2; puddleMesh.position.y = 0.03; scene.add(puddleMesh);
  }
}

// ---------- bubbles (見た目) ----------
const BUB = 80;
const bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, roughness: 0, envMapIntensity: 2 }), BUB);
bubbles.renderOrder = 1.5; scene.add(bubbles);
const bubData = Array.from({ length: BUB }, () => ({ alive: false, p: new THREE.Vector3(), v: 0, s: 0 }));
const dummy = new THREE.Object3D();

// ---------- state ----------
const state = { phase: 'ready', level: BASE, dome: 0, spilled: 0, flow: 30, pouringSince: 0, releasedAt: 0, overflow: false };
function fallTime() { return Math.sqrt(2 * Math.max(spoutY - Math.max(state.level, BASE), 1) / GRAV); }

// ---------- audio ----------
let actx, master, resA, resB, splashGain, resGain, noiseSrc, spillGain;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  noiseSrc = actx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
  master = actx.createGain(); master.gain.value = 0;
  const comp = actx.createDynamicsCompressor(); master.connect(comp).connect(actx.destination);
  resA = actx.createBiquadFilter(); resA.type = 'bandpass'; resA.Q.value = 14;
  resB = actx.createBiquadFilter(); resB.type = 'bandpass'; resB.Q.value = 14;
  resGain = actx.createGain(); resGain.gain.value = 1.6;
  const resBGain = actx.createGain(); resBGain.gain.value = 0.35;
  noiseSrc.connect(resA).connect(resGain).connect(master);
  noiseSrc.connect(resB).connect(resBGain).connect(resGain);
  const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000;
  splashGain = actx.createGain(); splashGain.gain.value = 0.12;
  noiseSrc.connect(hp).connect(lp).connect(splashGain).connect(master);
  const spLp = actx.createBiquadFilter(); spLp.type = 'lowpass'; spLp.frequency.value = 1400;
  spillGain = actx.createGain(); spillGain.gain.value = 0;
  noiseSrc.connect(spLp).connect(spillGain).connect(actx.destination);
  noiseSrc.start();
}
function airColumnFreq() {
  // 1/4波長共鳴: f = c / (4 (L + 0.6 r))  L=水面から縁まで
  const L = Math.max(0, G.H - Math.max(state.level, BASE)) * (state.dome > 0 ? 0 : 1);
  return SOUND_C / (4 * (L + 0.6 * G.rti));
}
// 「トク」1回分: 瓶に空気が入る時のボコッ＋水の塊がグラスに落ちて空気柱が鳴る
let nextGlug = 0, lastGlugAt = -1, glugCount = 0;
function glug(f, t) {
  // (a) グラスの空気柱を叩く音（水位で音程が上がる＝ここが聞きどころ）
  const src = actx.createBufferSource(); src.buffer = noiseSrc.buffer;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 22;
  const bp2 = actx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = Math.min(f * 3, 18000); bp2.Q.value = 22;
  const g = actx.createGain(), g2 = actx.createGain();
  const amp = 2.2 + Math.random() * 0.8;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  g2.gain.value = 0.3;
  src.connect(bp).connect(g).connect(master);
  src.connect(bp2).connect(g2).connect(g);
  src.start(t, Math.random() * 1.5, 0.12);
  // (b) 瓶の首のボコッ（トク）: 瓶が空くほど少し低くなる
  const o = actx.createOscillator(), og = actx.createGain();
  o.type = 'sine';
  const fb = 330 - Math.min(glugCount, 120) * 0.6 + (Math.random() - 0.5) * 30;
  o.frequency.setValueAtTime(fb * 1.25, t); o.frequency.exponentialRampToValueAtTime(fb * 0.8, t + 0.06);
  og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.32, t + 0.006);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(og).connect(master); o.start(t); o.stop(t + 0.1);
  glugCount++;
}

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
const blind = $('blind'), result = $('result'), hint = $('hint'), practice = $('practice');
let best = 0;
try { best = Number(localStorage.getItem('blindpour.best') || 0); } catch {}
function showBest() { $('best').textContent = best ? `ベスト ${best.toFixed(0)} 点` : 'ベスト ―'; }

let glassIdx = 0;
function newRound() {
  glassIdx = Math.floor(Math.random() * GLASSES.length);
  setupGlass(glassIdx);
  Object.assign(state, { phase: 'ready', level: BASE, dome: 0, spilled: 0, overflow: false,
    flow: 24 + Math.random() * 18 }); // 毎回流量が違う（時間を数えても当たらない）
  rebuildWater();
  glugCount = 0;
  bubData.forEach(b => b.alive = false);
  $('glassName').textContent = `${GLASSES[glassIdx].name}　流量 ???`;
  result.style.display = 'none'; hint.style.display = 'block'; blind.style.display = 'none';
  showBest();
}

function startPour(e) {
  if (state.phase !== 'ready') return;
  if (e.target.closest && e.target.closest('.card')) return;
  initAudio(); actx.resume();
  state.phase = 'pouring'; state.pouringSince = performance.now() / 1000;
  hint.style.display = 'none';
  if (!practice.checked) blind.style.display = 'flex';
}
function endPour() {
  if (state.phase !== 'pouring') return;
  state.phase = 'settling'; state.releasedAt = performance.now() / 1000;
}
addEventListener('pointerdown', startPour);
addEventListener('pointerup', endPour);
addEventListener('pointercancel', endPour);
addEventListener('blur', endPour);
$('next').addEventListener('click', newRound);

function finish() {
  state.phase = 'result';
  blind.style.display = 'none'; result.style.display = 'block';
  if (master) master.gain.setTargetAtTime(0, actx.currentTime, 0.03);
  const mm = (G.H - state.level) * 10;
  let main, sub, score;
  if (state.overflow) {
    main = 'あふれた！'; sub = `こぼれた量 約${state.spilled.toFixed(0)} ml`; score = 0;
    $('resultMain').style.color = 'var(--bad)';
  } else if (state.dome > 0) {
    main = `+${(state.dome * 10).toFixed(1)} mm`; sub = '縁を越えて表面張力で耐えた'; score = 100 + 20 * state.dome / BULGE_MAX;
    $('resultMain').style.color = 'var(--good)';
  } else {
    main = `残り ${mm.toFixed(1)} mm`; sub = 'ふちまで';
    score = Math.max(0, 100 - mm * 2.2);
    $('resultMain').style.color = mm < 5 ? 'var(--good)' : 'var(--text)';
  }
  $('resultSub').textContent = sub; $('resultMain').textContent = main;
  $('score').textContent = `${score.toFixed(0)} 点　（流量 ${state.flow.toFixed(0)} ml/秒）`;
  if (score > best) { best = score; try { localStorage.setItem('blindpour.best', String(best)); } catch {} }
  showBest();
  const rank = rankOf(mm);
  $('rank').textContent = `【${rank}】`;
  lastResult = { rank, main, sub, score, glass: GLASSES[glassIdx].name, practice: practice.checked };
  renderAll(); // 結果画像用に、いまの画面を取っておく
  snap = document.createElement('canvas');
  snap.width = renderer.domElement.width; snap.height = renderer.domElement.height;
  snap.getContext('2d').drawImage(renderer.domElement, 0, 0);
}

// ---------- 称号・シェア ----------
const GAME_URL = 'https://kokoaru-ltd.github.io/blockyclaw-site/blind-pour/';
let lastResult = null, snap = null;
function rankOf(mm) {
  if (state.overflow) return 'ザル耳';
  if (state.dome > 0) return '表面張力の支配者';
  if (mm <= 1) return '神の耳';
  if (mm <= 3) return '絶対音感バーテンダー';
  if (mm <= 6) return 'いい耳';
  if (mm <= 12) return 'ふつうの耳';
  return 'ビビり注ぎ';
}
function shareText() {
  const r = lastResult;
  const how = r.practice ? '練習モードで注いだ結果' : '目隠しで、音だけで注いだ結果';
  return `🥃 BLIND POUR\n${how}…\n【${r.rank}】${r.sub} ${r.main}（${r.glass}）\n\nあなたの耳は何mm？🎧\n#BLINDPOUR`;
}
function cardCanvas() {
  const W = 1200, H = 630, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0d0e'; g.fillRect(0, 0, W, H);
  if (snap) { // 左半分に、グラス中心で切り抜いた画面
    const sw = snap.width, sh = snap.height, aw = 600, ah = H;
    const scale = Math.max(aw / sw, ah / sh) * 1.35;
    const dw = sw * scale, dh = sh * scale;
    g.save(); g.beginPath(); g.rect(0, 0, aw, ah); g.clip();
    g.drawImage(snap, (aw - dw) / 2, (ah - dh) / 2 + dh * 0.04, dw, dh); g.restore();
    const fade = g.createLinearGradient(440, 0, 600, 0);
    fade.addColorStop(0, 'rgba(13,13,14,0)'); fade.addColorStop(1, 'rgba(13,13,14,1)');
    g.fillStyle = fade; g.fillRect(440, 0, 160, H);
  }
  const r = lastResult, x = 640, font = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif';
  g.fillStyle = '#a29e95'; g.font = `700 26px ${font}`; g.fillText('BLIND POUR', x, 92);
  g.fillText(r.practice ? '練習モード' : '目隠しで、音だけで注いだ', x, 132);
  g.fillStyle = '#ffcf4a'; g.font = `900 ${r.rank.length > 6 ? 46 : 60}px ${font}`; g.fillText(`【${r.rank}】`, x - 14, 250);
  g.fillStyle = '#a29e95'; g.font = `400 28px ${font}`; g.fillText(r.sub, x, 320);
  g.fillStyle = r.main.startsWith('あふれ') ? '#ff7b7b' : '#f3f0e8'; g.font = `900 72px ${font}`; g.fillText(r.main, x, 400);
  g.fillStyle = '#a29e95'; g.font = `400 26px ${font}`; g.fillText(`${r.glass}　${r.score.toFixed(0)} 点`, x, 452);
  g.fillStyle = '#6f6b64'; g.font = `400 20px ${font}`; g.fillText('kokoaru-ltd.github.io/blockyclaw-site/blind-pour/', x, 572);
  return c;
}
$('share').addEventListener('click', () => {
  if (!lastResult) return;
  const q = new URLSearchParams({ text: shareText(), url: GAME_URL });
  window.open('https://twitter.com/intent/tweet?' + q.toString(), '_blank', 'noopener');
});
$('saveImg').addEventListener('click', async () => {
  if (!lastResult) return;
  const c = cardCanvas();
  const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
  const name = `blind-pour_${lastResult.rank}.png`;
  // スマホは共有シートに画像ごと渡せる（Xアプリに添付できる）
  try {
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer: coarse)').matches) {
      await navigator.share({ files: [file], text: shareText() + '\n' + GAME_URL });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.download = name; a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

// ---------- simulation ----------
const clock = new THREE.Clock();
let lastRebuild = 0;
function addVolume(dv) {
  if (state.overflow) { state.spilled += dv; return; }
  let v = dv;
  while (v > 0) {
    if (state.level < G.H) {
      const area = Math.PI * rIn(state.level) ** 2;
      const dh = Math.min(v / area, G.H - state.level);
      state.level += dh; v -= dh * area;
      if (dh <= 1e-9) break;
    } else {
      const R = (G.rti + G.rt) / 2, capArea = Math.PI * R * R * 0.5;
      const dd = v / capArea;
      if (state.dome + dd > BULGE_MAX) { state.overflow = true; state.dome = BULGE_MAX * 0.6; state.spilled += v; v = 0; }
      else { state.dome += dd; v = 0; }
    }
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now() / 1000;
  const ft = fallTime();
  let landing = 0; // 水面に届いている流量の割合
  if (state.phase === 'pouring') {
    const t = now - state.pouringSince;
    landing = t < ft ? 0 : Math.min(1, (t - ft) / 0.12);
  } else if (state.phase === 'settling') {
    const t = now - state.releasedAt; // 離した後も空中の水は落ちてくる
    landing = t < ft ? 1 : 0;
    if (t > ft + 0.35) finish();
  }
  if (landing > 0) {
    const jitter = 1 + Math.sin(now * 9.3) * 0.05 + Math.sin(now * 23.1) * 0.03;
    addVolume(state.flow * landing * jitter * dt);
  }

  // audio
  if (actx) {
    const tA = actx.currentTime;
    const f = Math.min(airColumnFreq(), 9000);
    resA.frequency.setTargetAtTime(f, tA, 0.015);
    resB.frequency.setTargetAtTime(Math.min(f * 3, 18000), tA, 0.015);
    const low = state.level < BASE + 0.4 ? 1 : 0; // 底を叩く音
    splashGain.gain.setTargetAtTime(0.1 + low * 0.25, tA, 0.05);
    // 連続音は小さめ（音程の手がかりとして薄く鳴らす）、主役は「トクトク」
    resGain.gain.setTargetAtTime(0.5, tA, 0.05);
    master.gain.setTargetAtTime(landing > 0 ? (state.overflow ? 0.3 : 0.9) : 0, tA, 0.02);
    spillGain.gain.setTargetAtTime(state.overflow && landing > 0 ? 0.5 : 0, tA, 0.04);
    if (landing > 0 && tA > nextGlug) {
      if (!state.overflow) glug(f, tA + 0.005);
      lastGlugAt = now;
      nextGlug = tA + 1 / (7 + Math.random() * 3); // 1秒に7〜10回
    }
  }

  // visuals
  const surfaceY = state.dome > 0 ? G.H + state.dome : Math.max(state.level, BASE);
  const pouringVisible = state.phase === 'pouring' || (state.phase === 'settling' && now - state.releasedAt < ft);
  if (pouringVisible) {
    let top = spoutY, bottom = surfaceY;
    if (state.phase === 'pouring') { const t = now - state.pouringSince; bottom = Math.max(surfaceY, spoutY - 0.5 * GRAV * t * t); }
    else { const t = now - state.releasedAt; top = Math.min(spoutY, spoutY - 0.5 * GRAV * t * t); }
    const len = Math.max(0.01, top - bottom);
    const pulse = 1 + 0.45 * Math.exp(-Math.max(0, now - lastGlugAt) / 0.05); // トクのたびに太くなる
    streamMesh.visible = true; streamMesh.scale.set(pulse, len, pulse);
    streamMesh.position.set(0, bottom + len / 2, 0);
  } else streamMesh.visible = false;

  if ((state.phase === 'pouring' || state.phase === 'settling') && now - lastRebuild > 0.03) { rebuildWater(); lastRebuild = now; }

  // bubbles
  if (landing > 0 && !state.overflow) {
    for (let k = 0; k < 3; k++) {
      const b = bubData.find(x => !x.alive);
      if (!b) break;
      const depth = Math.random() * Math.min(3, surfaceY - BASE);
      b.alive = true; b.p.set((Math.random() - 0.5) * 1.2, surfaceY - depth, (Math.random() - 0.5) * 1.2);
      b.v = 3 + Math.random() * 6; b.s = 0.03 + Math.random() * 0.07;
    }
  }
  bubData.forEach((b, i) => {
    if (b.alive) {
      b.p.y += b.v * dt; b.p.x *= 1 + dt * 0.8; b.p.z *= 1 + dt * 0.8;
      const r = rIn(b.p.y) - 0.1;
      if (b.p.y > surfaceY - 0.02 || Math.hypot(b.p.x, b.p.z) > r) b.alive = false;
    }
    dummy.position.copy(b.p); dummy.scale.setScalar(b.alive ? b.s : 0); dummy.updateMatrix();
    bubbles.setMatrixAt(i, dummy.matrix);
  });
  bubbles.instanceMatrix.needsUpdate = true;

  // overflow visuals
  const spill = state.spilled;
  sheetMesh.material.opacity = state.overflow ? 0.18 : 0;
  puddleMesh.visible = spill > 0.5;
  if (puddleMesh.visible) puddleMesh.scale.setScalar(Math.min(G.rb + 1 + Math.sqrt(spill) * 0.35, G.rb + 9));

  controls.update();
  renderAll();
  requestAnimationFrame(tick);
}

const _sz = new THREE.Vector2();
function renderAll() {
  // 画面サイズが変わっていたら追従（非表示状態で読み込まれた場合など）
  const cw = renderer.domElement.clientWidth, ch = renderer.domElement.clientHeight;
  if ((innerWidth && innerWidth !== cw) || (innerHeight && innerHeight !== ch)) {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  renderer.getDrawingBufferSize(_sz);
  if (_sz.x !== bgRT.width || _sz.y !== bgRT.height) sizeRT();
  // 1) 水とガラスを除いた背景を描く 2) 本番描画（水がそれを屈折して写す）
  const hide = [glassMesh, waterMesh, streamMesh, puddleMesh, sheetMesh, bubbles].filter(Boolean);
  const vis = hide.map(o => o.visible);
  hide.forEach(o => o.visible = false);
  renderer.setRenderTarget(bgRT); renderer.render(scene, camera); renderer.setRenderTarget(null);
  hide.forEach((o, i) => o.visible = vis[i]);
  renderer.render(scene, camera);
}
function sizeRT() {
  const v = renderer.getDrawingBufferSize(new THREE.Vector2());
  bgRT.setSize(v.x, v.y); resUniform.value.copy(v);
}
sizeRT();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); sizeRT();
});

newRound();
tick();
// debug hook (検証用)
window.__pour = { state, addVolume, rebuildWater, render: () => renderAll(), renderer, bgRT, resUniform, THREE, finish, cardCanvas, glassMat, waterMat, get G() { return G; } };
</script>
</body>
</html>
