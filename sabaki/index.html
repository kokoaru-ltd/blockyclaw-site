<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>さばき 一尾入魂 SABAKI</title>
<meta name="description" content="指で鱗を取り、頭を落とし、三枚におろして刺身を引く。まな板の上の魚さばきゲーム。">
<meta property="og:title" content="一尾入魂 SABAKI — 魚さばきゲーム">
<meta property="og:description" content="指で鱗を取り、頭を落とし、三枚におろして刺身を引く。盛り付けたら親方の鑑定。">
<meta property="og:image" content="https://kokoaru-ltd.github.io/blockyclaw-site/thumbs/sabaki.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--ink:#2b2420;--paper:#f6efe4;--red:#c8332b;--wood:#c9a36b}
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#1d1a17;color:var(--ink);font:15px/1.5 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;top:max(10px,env(safe-area-inset-top));text-align:center;pointer-events:none}
#step{display:inline-block;max-width:calc(100vw - 24px);background:#f6efe4ee;border-radius:4px;padding:6px 14px;box-shadow:0 2px 8px #0004;font-weight:bold;letter-spacing:.08em}
#step small{display:block;font-weight:normal;font-size:12px;letter-spacing:0}
#meter{width:min(70vw,320px);height:6px;margin:6px auto 0;background:#0003;border-radius:3px;overflow:hidden;display:none}
#meter i{display:block;height:100%;width:0;background:var(--red)}
#say{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(22px,8vw,44px);max-width:92vw;text-align:center;font-weight:900;color:#fff;text-shadow:0 3px 0 var(--red),0 0 18px #000a;opacity:0;pointer-events:none;white-space:normal;line-height:1.25;transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#say.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#next{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font:bold 17px inherit;font-family:inherit;padding:12px 28px;border:0;border-radius:4px;background:var(--red);color:#fff;box-shadow:0 4px 0 #7d1f19;display:none;letter-spacing:.1em}
#title,#result{position:fixed;inset:0;display:grid;place-items:center;background:#1d1a17e8;color:var(--paper);text-align:center;padding:24px}
#title h1{font-size:clamp(32px,11vw,46px);letter-spacing:.2em;line-height:1.2}
#title h1 small{display:block;font-size:14px;letter-spacing:.5em;color:#d9b77c}
#title p{margin:14px 0 16px;color:#d6cbb8}
#pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
#pick a{display:block;background:#2b241d;border:1px solid #5a4630;border-radius:6px;padding:6px 4px;color:var(--paper);text-decoration:none}
#pick a.on{border-color:#d9b77c}#pick img{width:100%;aspect-ratio:2/1;object-fit:contain}#pick b{display:block;font-size:16px}#pick small{color:#d9b77c;font-size:11px}
#title button,#result button{font:bold 18px inherit;font-family:inherit;padding:12px 34px;border:0;border-radius:4px;background:var(--red);color:#fff;box-shadow:0 4px 0 #7d1f19;letter-spacing:.15em;margin:6px}
#result{display:none;background:#1d1a17cc}
#card{background:var(--paper);color:var(--ink);border-radius:6px;padding:18px 22px;max-width:360px;width:100%;box-shadow:0 10px 40px #000}
#card h2{font-size:15px;letter-spacing:.3em;color:#8a6b45}
#rank{font-size:52px;font-weight:900;color:var(--red);line-height:1.2;margin:2px 0 6px}
#card table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
#card td{padding:4px 0;border-bottom:1px dotted #b9a68a}
#card td:last-child{text-align:right;font-weight:bold}
#credit{position:fixed;right:8px;bottom:4px;font-size:10px;color:#fff6;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="step"></div><div id="meter"><i></i></div></div>
<div id="say"></div>
<button id="next">次へ</button>
<div id="title"><div>
  <h1><small>SABAKI</small>一尾入魂</h1>
  <p>指で鱗を取り、頭を落とし、三枚におろして刺身を引く。<br>今日の魚を選んで。</p>
  <div id="pick"></div>
</div></div>
<div id="result"><div id="card">
  <h2>親 方 の 鑑 定</h2>
  <div id="rank"></div>
  <table id="tbl"></table>
  <button id="xpost" style="background:#000;box-shadow:0 4px 0 #444">𝕏 で共有</button><br><button id="share">結果を保存</button><button id="again">もう一尾</button>
</div></div>
<div id="credit">魚の写真：AIで作成（実在の個体ではありません）</div>

<script type="module">
// ============================================================================
// SABAKI — a fish-filleting game for the phone browser. Canvas 2D, no libraries.
// The fish is one photo (cut out) plus its body outline; everything that happens to it (scales, cuts, flesh, bones,
// slices) is drawn on top of that photo in code. All coordinates are in the photo's pixels (F space); a view
// transform fits the board to the screen and turns it upright on a portrait phone.
// Stages: 0 scales  1 head  2 fillet (two strokes)  3 sashimi  4 plate + appraisal
// ============================================================================
const $ = (id) => document.getElementById(id);
const cv = $('c'), x = cv.getContext('2d');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t, ease = (t) => t * t * (3 - 2 * t);
const back = (t) => 1 + 2.7 * (t - 1) ** 3 + 1.7 * (t - 1) ** 2;

// ---------------------------------------------------------------- assets
// the fish of the day: ?fish=<id> (the title screen sets it)
const FISHES = [
  { id: 'aji', ja: '鯵', en: 'Horse mackerel', skin: '#9fa9a6', lv: 1 },
  { id: 'saba', ja: '鯖', en: 'Mackerel', skin: '#4f7f86', lv: 2 },
  { id: 'madai', ja: '真鯛', en: 'Red sea bream', skin: '#d4565a', lv: 2 },
  { id: 'kinmedai', ja: '金目鯛', en: 'Splendid alfonsino', skin: '#c8332b', lv: 2 },
  { id: 'buri', ja: '鰤', en: 'Yellowtail', skin: '#6f8fa0', lv: 3 },
  { id: 'katsuo', ja: '鰹', en: 'Skipjack', skin: '#2f3f86', lv: 3 },
];
const QS = new URLSearchParams(location.search), FISH = FISHES.find((f) => f.id === QS.get('fish')) || FISHES[3], FID = FISH.id, SKIN = FISH.skin;
{ const t = document.getElementById('pick'); t.innerHTML = FISHES.map((f) => `<a href="?fish=${f.id}&go=1" class="${f.id === FID ? 'on' : ''}"><img src="assets/${f.id}.png" alt=""><b>${f.ja}</b><small>${'★'.repeat(f.lv)}</small></a>`).join(''); }
const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const [FOOD_FLESH, FOOD_SLICE] = await Promise.all([loadImg(`assets/food/${FID}_flesh.jpg`), loadImg(`assets/food/${FID}_slice_cut.png`)]);
const D = await (await fetch(`assets/${FID}.json`)).json();
const IMG = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = `assets/${FID}.png`; });
const FW = D.w, FH = D.h, [BX0, BX1] = D.body;
const top = (px) => D.top[clamp(Math.round(px), 0, FW - 1)], bot = (px) => D.bot[clamp(Math.round(px), 0, FW - 1)];
const spineY = (px) => { const s = D.spine; if (px <= s[0][0]) return s[0][1]; for (let i = 1; i < s.length; i++) if (s[i][0] >= px) { const a = s[i - 1], b = s[i]; return lerp(a[1], b[1], (px - a[0]) / (b[0] - a[0])); } return s[s.length - 1][1]; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const bodyPath = (g, x0 = BX0, x1 = BX1, pad = 0) => { g.beginPath(); for (let i = x0; i <= x1; i += 4) { if (top(i) < 0) continue; g.lineTo(i, top(i) - pad); } for (let i = x1; i >= x0; i -= 4) { if (bot(i) < 0) continue; g.lineTo(i, bot(i) + pad); } g.closePath(); };

// the scaled skin (the photo) and the same fish with the scales gone: softer, glossier, a little darker and redder
const scaled = mk(FW, FH); scaled.getContext('2d').drawImage(IMG, 0, 0);
const skin = mk(FW, FH);
{
  const g = skin.getContext('2d'), sd = scaled.getContext('2d').getImageData(0, 0, FW, FH), s = sd.data, o = g.createImageData(FW, FH), d = o.data;
  const blur = new Float32Array(FW * FH * 3);
  for (let y = 0; y < FH; y++) for (let xx = 0; xx < FW; xx++) {   // 5x5 box blur of the colour
    let r = 0, gg = 0, b = 0, n = 0;
    for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) { const X = xx + i, Y = y + j; if (X < 0 || Y < 0 || X >= FW || Y >= FH) continue; const k = (Y * FW + X) * 4; if (s[k + 3] < 128) continue; r += s[k]; gg += s[k + 1]; b += s[k + 2]; n++; }
    const q = (y * FW + xx) * 3; if (n) { blur[q] = r / n; blur[q + 1] = gg / n; blur[q + 2] = b / n; }
  }
  for (let i = 0, q = 0; i < s.length; i += 4, q += 3) {
    let r = lerp(s[i], blur[q], .88), gg = lerp(s[i + 1], blur[q + 1], .88), b = lerp(s[i + 2], blur[q + 2], .88);
    const L = (r + gg + b) / 3; r = L + (r - L) * 1.25; gg = L + (gg - L) * 1.25; b = L + (b - L) * 1.25;
    d[i] = r * .9; d[i + 1] = gg * .86; d[i + 2] = b * .88; d[i + 3] = s[i + 3];
  }
  g.putImageData(o, 0, 0);
  // wet sheen along the back, only on the body
  g.save(); bodyPath(g); g.clip(); g.globalCompositeOperation = 'lighter';
  for (let i = BX0; i < BX1; i += 3) { const t = top(i), h = bot(i) - t; if (t < 0) continue; const gr = g.createLinearGradient(0, t, 0, t + h * .5); gr.addColorStop(0, '#0000'); gr.addColorStop(.22, '#ffffff40'); gr.addColorStop(.3, '#ffffff18'); gr.addColorStop(1, '#0000'); g.fillStyle = gr; g.fillRect(i, t, 3, h); }
  g.restore();
}
// scale mask: white where scales are still on. Only the body behind the head has scales here
const smask = mk(FW, FH), sm = smask.getContext('2d'); sm.fillStyle = '#fff'; sm.fillRect(0, 0, FW, FH);
const SCALE_X0 = D.cut[1][0] - 10, SCALE_X1 = BX1 - 24;
// flesh: white with a blush of pink, the W-shaped muscle bands, a red line under the skin
function fleshCanvas(w, h, seed) {
  const c = mk(w, h), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#e9a99a'); gr.addColorStop(.18, '#f4cfc4'); gr.addColorStop(.5, '#f9e2da'); gr.addColorStop(.82, '#f2c9bd'); gr.addColorStop(1, '#e39d8e'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#d98f8066'; g.lineWidth = 2.5;
  for (let i = -h; i < w + h; i += 22) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h * .25, h * .45); g.lineTo(i - h * .05, h * .55); g.lineTo(i + h * .25, h); g.stroke(); }
  let r = seed; const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < w * h / 90; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * .18})`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1); }
  return c;
}
const FLESH = fleshCanvas(FW, FH, 7);
if (FOOD_FLESH) { const g = FLESH.getContext('2d'), k = Math.max(FW / FOOD_FLESH.width, FH / FOOD_FLESH.height) * 1.15; g.drawImage(FOOD_FLESH, (FW - FOOD_FLESH.width * k) / 2, (FH - FOOD_FLESH.height * k) / 2, FOOD_FLESH.width * k, FOOD_FLESH.height * k);
  const v = g.createLinearGradient(0, 0, 0, FH); v.addColorStop(0, 'rgba(120,40,30,.18)'); v.addColorStop(.2, 'rgba(0,0,0,0)'); v.addColorStop(.8, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(120,40,30,.18)'); g.fillStyle = v; g.fillRect(0, 0, FW, FH); }

// ---------------------------------------------------------------- view: fit the board, upright on a portrait phone
let VW = 0, VH = 0, DPR = 1, M = new DOMMatrix(), MI = new DOMMatrix();
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR;
  const port = VH > VW, sw = port ? VH : VW, sh = port ? VW : VH;
  const s = Math.min(sw * .86 / FW, sh * (port ? .98 : .7) / FH);
  M = new DOMMatrix().scale(DPR).translate(VW / 2, VH / 2 + (port ? 10 : 18));
  if (port) M = M.rotate(90);
  M = M.scale(s).translate(-FW / 2, -FH / 2); MI = M.inverse();
  SC = s;
}
let SC = 1; addEventListener('resize', resize); resize();
const toF = (e) => { const p = new DOMPoint(e.clientX * DPR, e.clientY * DPR).matrixTransform(MI); return { x: p.x, y: p.y }; };

// ---------------------------------------------------------------- sound: everything synthesized
let AC, NB;
const audio = () => { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; };
function noise(f, q, v, dur, f2) { if (!AC) return; const t = AC.currentTime, s = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NB; b.type = 'bandpass'; b.frequency.setValueAtTime(f, t); if (f2) b.frequency.exponentialRampToValueAtTime(f2, t + dur); b.Q.value = q; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); s.connect(b); b.connect(g); g.connect(AC.destination); s.start(t, Math.random() * .5); s.stop(t + dur); }
function tone(f0, f1, v, dur, type = 'sine') { if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur); }
const SND = {
  scrape: () => noise(2600 + Math.random() * 1600, 2.5, .22, .07),
  knife: () => noise(5000, 1.2, .25, .35, 1500),
  thud: () => { tone(140, 45, .9, .25); noise(300, 1, .5, .12); },
  slice: () => { noise(6000, 2, .25, .09, 2500); tone(900, 600, .05, .05, 'triangle'); },
  crunch: () => noise(1200, 3, .5, .12),
  ding: () => { tone(880, 880, .25, .9, 'triangle'); tone(1320, 1320, .12, 1.2, 'triangle'); },
};
const buzz = (ms) => navigator.vibrate && navigator.vibrate(ms);

// ---------------------------------------------------------------- game state
const G = { st: -1, cover: 0, cut: null, headT: 0, entry: null, path: [], fillets: 0, err: [], lift: 0, cuts: [], slices: [], score: {} };
const P = [];   // particles: scale flakes, sparks
function say(t) { const s = $('say'); s.textContent = t; s.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => s.classList.remove('on'), 900); }
function stepUI(t, sub, meter) { $('step').innerHTML = `${t}<small>${sub}</small>`; $('meter').style.display = meter ? 'block' : 'none'; }
function next(label, fn) { const b = $('next'); b.textContent = label; b.style.display = 'block'; b.onclick = () => { b.style.display = 'none'; fn(); }; }

function stage(n) {
  G.st = n;
  if (n === 0) stepUI('一、鱗を取る', '尾から頭へ、指でこそげる', true);
  if (n === 1) stepUI('二、頭を落とす', 'えらの後ろに、指で一本線を引く', false);
  if (n === 2) stepUI('三、三枚におろす', G.fillets ? '裏も同じく。中骨に沿って' : '切り口の中骨の上に包丁を入れ、尾まで引く', false);
  if (n === 3) stepUI('四、刺身を引く', '身を縦に、指で切る。厚さをそろえて', false);
}

// ---------------------------------------------------------------- input
let drag = null;
const toP = (e) => (G.st === 4 ? { x: e.clientX, y: e.clientY } : G.st === 2 ? toG(toF(e)) : toF(e));
cv.addEventListener('pointerdown', (e) => { audio(); cv.setPointerCapture(e.pointerId); const p = toP(e); drag = { p0: p, p, last: p, t: performance.now() }; down(p); });
cv.addEventListener('pointermove', (e) => { if (!drag) return; const p = toP(e); move(p, drag.last); drag.last = p; drag.p = p; });
cv.addEventListener('pointerup', (e) => { if (!drag) return; const p = toP(e); move(p, drag.last); up(drag.p0, p); drag = null; });
cv.addEventListener('pointercancel', () => { drag = null; G.path = []; });

const inBody = (p, pad = 0) => p.x > BX0 && p.x < BX1 && top(p.x) >= 0 && p.y > top(p.x) - pad && p.y < bot(p.x) + pad;
function down(p) {
  if (G.st === 4) return plateDown(p);
  if (G.st === 2 && !G.lift) {
    const cx = cutX(spineY(p.x));
    if (Math.abs(p.x - cx) < 70 && p.y > top(cx + 10) - 20 && p.y < bot(cx + 10) + 20) { G.entry = { x: cx, y: p.y }; G.path = [{ x: cx, y: p.y }]; SND.knife(); buzz(8); }
  }
}
let scrapeT = 0;
function move(p, q) {
  if (G.st === 4) return plateMove(p);
  if (G.st === 0) {
    const dx = p.x - q.x, dist = Math.hypot(dx, p.y - q.y); if (!dist) return;
    const against = clamp(-dx / dist, 0, 1);                       // tail to head (against the scales) works best
    sm.save(); sm.globalCompositeOperation = 'destination-out'; bodyPath(sm, SCALE_X0, SCALE_X1); sm.clip();
    const R = 30, steps = Math.ceil(dist / 6);
    for (let i = 0; i <= steps; i++) { const t = i / steps, X = lerp(q.x, p.x, t), Y = lerp(q.y, p.y, t), g = sm.createRadialGradient(X, Y, 0, X, Y, R);
      g.addColorStop(0, `rgba(0,0,0,${.35 + .6 * against})`); g.addColorStop(1, 'rgba(0,0,0,0)'); sm.fillStyle = g; sm.fillRect(X - R, Y - R, R * 2, R * 2); }
    sm.restore();
    if (inBody(p) && p.x > SCALE_X0 && p.x < SCALE_X1) {
      const n = Math.round(1 + 4 * against * Math.min(1, dist / 12));
      for (let i = 0; i < n; i++) P.push({ x: p.x + (Math.random() - .5) * 30, y: p.y + (Math.random() - .5) * 30, vx: -dx * 4 + (Math.random() - .5) * 300, vy: (Math.random() - .5) * 300 - 120, r: Math.random() * 6.28, vr: (Math.random() - .5) * 20, s: 4 + Math.random() * 5, life: .7, c: Math.random() < .5 ? '#f6d0c8' : '#ffffff' });
      const now = performance.now(); if (now - scrapeT > 55) { scrapeT = now; SND.scrape(); buzz(4); }
    }
  }
  if (G.st === 2 && G.entry && !G.lift) { if (p.x > G.path[G.path.length - 1].x) G.path.push({ x: p.x, y: p.y }); if (Math.random() < .25) SND.knife(); }
  if (G.st === 1 || G.st === 3) G.drawLine = { a: drag.p0, b: p };
}
function up(a, b) {
  if (G.st === 4) return plateUp();
  G.drawLine = null;
  if (G.st === 1 && !G.cut) headCut(a, b);
  if (G.st === 2 && G.entry && !G.lift) filletStroke();
  if (G.st === 3) sliceCut(a, b);
}

// ---------------------------------------------------------------- stage 0: scales
function coverage() {
  const d = sm.getImageData(0, 0, FW, FH).data; let on = 0, n = 0;
  for (let X = SCALE_X0; X < SCALE_X1; X += 8) for (let Y = top(X) + 6; Y < bot(X) - 6; Y += 8) { n++; if (d[(Math.round(Y) * FW + Math.round(X)) * 4 + 3] > 100) on++; }
  return n ? 1 - on / n : 0;
}
setInterval(() => {
  if (G.st !== 0) return;
  G.cover = coverage(); $('meter').firstChild.style.width = `${Math.round(G.cover * 100)}%`;
  if (G.cover > .8 && $('next').style.display !== 'block') next('頭を落とす', () => { G.score.scale = G.cover; stage(1); });
}, 250);

// ---------------------------------------------------------------- stage 1: the head
let cutLine = null;   // {a, b} in F space; the body is on the right of a->b
const cutX = (y) => cutLine ? lerp(cutLine.a.x, cutLine.b.x, (y - cutLine.a.y) / (cutLine.b.y - cutLine.a.y)) : 0;
function headCut(a, b) {
  if (a.y > b.y) [a, b] = [b, a];
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const mx = (a.x + b.x) / 2;
  if (len < 120 || Math.abs(b.y - a.y) < len * .6 || mx < BX0 + 40 || mx > BX0 + (BX1 - BX0) * .6 || a.y > top(mx) + 30 || b.y < bot(mx) - 30) { say('切れていない…'); return; }
  // extend the line past the fish
