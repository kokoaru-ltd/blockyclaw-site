<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Constraint, Query } = Matter;
const INK = '#26221d', PAPER = '#f3eee2', SKIN = '#fffdf6', RED = '#d8432e';
const SW = 1000, SH = 720, FLOOR = 650, HORIZON = 500;
const MAX_PINS = 6, MAX_FRAMES = 4, POSE_SEC = 45, ANSWER_SEC = 30, FRAME_MS = 560;
const GAME_URL = 'https://kokoaru-ltd.github.io/blockyclaw-site/nannopose/';
const FACES = [['normal','ふつう'],['happy','にこにこ'],['sad','かなしい'],['angry','おこ'],['surprise','びっくり'],['sleepy','ねむい'],['pain','いたい'],['dead','×_×']];
const PART_NAMES = ['head', 'chest', 'pelvis', 'uaL', 'faL', 'uaR', 'faR', 'thL', 'shL', 'thR', 'shR'];
const SHAPES = { head: [72, 72, 1, 'round'], chest: [62, 74, 2], pelvis: [56, 44, 3], uaL: [20, 62, 4], faL: [18, 60, 5, 'hand'], uaR: [20, 62, 6],
  faR: [18, 60, 7, 'hand'], thL: [24, 70, 8], shL: [20, 70, 9, 'foot'], thR: [24, 70, 10], shR: [20, 70, 11, 'foot'] };
const BACK = ['uaL', 'faL', 'thL', 'shL', 'pelvis', 'chest', 'head'], FRONT = ['thR', 'shR', 'uaR', 'faR'];
const SCENES = [['部屋', 'room'], ['駅のホーム', 'station'], ['浜辺', 'beach'], ['結婚式', 'wedding']];
const RATINGS = [['大爆笑', '😂'], ['ふふっ', '😏'], ['すべった', '😐']];

// ---------- 道具（形は物理用、飾りは手描き） ----------
const R = (x, y, w, h, r = 0) => Bodies.rectangle(x, y, w, h, r ? { chamfer: { radius: r } } : {});
const PROPS = [
  { id: 'umbrella', name: '傘', colors: ['#d8574a', '#c99b6a'],
    build: (x, y) => [Bodies.fromVertices(x, y - 74, [Array.from({ length: 9 }, (_, i) => { const a = Math.PI + i / 8 * Math.PI; return { x: Math.cos(a) * 64, y: Math.sin(a) * 40 }; })]), R(x, y, 6, 140, 2)],
    deco: (L) => { for (const dx of [-38, -13, 13, 38]) L([[0, -104], [dx, -66]]); L([[0, 70], [0, 80], [9, 86], [16, 80]], 2.8); } },
  { id: 'fish', name: '魚', colors: ['#8fb3c9'], build: (x, y) => [R(x, y, 96, 34, 16), Bodies.fromVertices(x + 54, y, [[{ x: 0, y: 0 }, { x: 26, y: -18 }, { x: 26, y: 18 }]])],
    deco: (L, dot) => { dot(-32, -4, 3.5); L([[-20, -12], [-16, 0], [-20, 12]]); L([[0, 4], [12, 6], [24, 4]]); } },
  { id: 'banana', name: 'バナナ', colors: ['#f0cf5a'], build: (x, y) => [R(x, y, 90, 22, 11)],
    deco: (L) => { L([[-40, -2], [0, 6], [40, -2]]); L([[42, -6], [50, -12]]); } },
  { id: 'cone', name: '三角コーン', colors: ['#ec8a3c', '#ec8a3c'], build: (x, y) => [Bodies.trapezoid(x, y - 6, 54, 80, 0.75), R(x, y + 38, 66, 10, 2)],
    deco: (L) => { L([[-11, -22], [11, -22]]); L([[-17, 4], [17, 4]]); } },
  { id: 'broom', name: 'ほうき', colors: ['#c99b6a', '#e3c37a'], build: (x, y) => [R(x, y - 20, 6, 130, 2), R(x, y + 62, 46, 40, 6)],
    deco: (L) => { for (const dx of [-14, -5, 5, 14]) L([[dx, 50], [dx * 1.2, 80]]); } },
  { id: 'pan', name: 'フライパン', colors: ['#5d5a55', '#5d5a55'], build: (x, y) => [Bodies.circle(x, y, 34), R(x + 64, y, 64, 9, 4)],
    deco: (L, dot, ring) => { ring(0, 0, 25); } },
  { id: 'ladder', name: 'はしご', colors: ['#c9a27a'], build: (x, y) => [R(x, y, 52, 170, 3)], hollow: true,
    deco: (L) => { L([[-22, -85], [-22, 85]], 2.6); L([[22, -85], [22, 85]], 2.6); for (let i = -3; i <= 3; i++) L([[-22, i * 24], [22, i * 24]], 2.4); } },
  { id: 'boot', name: '長ぐつ', colors: ['#5b8f5e', '#5b8f5e'], build: (x, y) => [R(x, y - 12, 34, 74, 6), R(x + 14, y + 30, 62, 22, 8)],
    deco: (L) => { L([[-17, -36], [17, -36]]); } },
  { id: 'box', name: 'ダンボール', colors: ['#cfa978'], build: (x, y) => [R(x, y, 92, 70, 3)],
    deco: (L) => { L([[-46, -24], [46, -24]]); L([[0, -35], [0, -24]]); } },
  { id: 'ball', name: 'ボール', colors: ['#6aa0d8'], build: (x, y) => [Bodies.circle(x, y, 30)],
    deco: (L) => { L([[-28, 0], [0, 6], [28, 0]]); L([[0, -29], [-6, 0], [0, 29]]); } },
  { id: 'plunger', name: 'スッポン', colors: ['#c99b6a', '#c94a3d'], build: (x, y) => [R(x, y - 18, 6, 100, 2), R(x, y + 42, 44, 22, 10)], deco: () => {} },
  { id: 'tire', name: 'タイヤ', colors: ['#3d3a36'], build: (x, y) => [Bodies.circle(x, y, 40)],
    deco: (L, dot, ring) => { ring(0, 0, 20, '#f3eee2'); } },
  { id: 'chicken', name: 'ゴムのニワトリ', colors: ['#f2d04f', '#f2d04f'], build: (x, y) => [R(x, y, 26, 110, 12), Bodies.circle(x, y - 62, 15)],
    deco: (L, dot) => { dot(5, -64, 2.5); L([[14, -64], [26, -60], [14, -56]]); L([[-6, -76], [-2, -84], [3, -77], [7, -84], [10, -76]]); L([[-6, 52], [-14, 64]]); L([[6, 52], [14, 64]]); } },
  { id: 'fan', name: 'せんぷうき', colors: ['#7fb7b0', '#7fb7b0'], build: (x, y) => [Bodies.circle(x, y - 36, 34), R(x, y + 26, 10, 70, 3)],
    deco: (L, dot, ring) => { ring(0, -36, 22); L([[0, -58], [0, -14]]); L([[-22, -36], [22, -36]]); L([[-24, 60], [24, 60]], 3); } },
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const panel = document.getElementById('panel'), bar = document.getElementById('bar');
let W, H, DPR, s = 1, ox = 0, oy = 0;
let engine, parts = [], props = [], pins = [], grips = [], drag = null, grain;
let state = 'title', scene = 0, propIds = [0, 1, 2], caption = '', face = 'normal', timeLeft = 0, timerOn = false;
let frames = [], playStart = 0, flash = 0, tsukkomi = '', rating = -1, reveal = false, answerDone = false, reroll = 1;

// ---------- 手描き風の線 ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let boil = 0;
function sketch(pts, seed, { closed = true, fill = null, width = 3, amp = 1.5, twice = true, color = INK, shade = false } = {}) {
  if (shade && fill) { // 2.5D：右下にずらした影
    const r0 = rng(seed * 977 + boil * 131);
    ctx.beginPath(); pts.forEach(([x, y], i) => { const px = x + 5 + (r0() - 0.5) * amp, py = y + 6 + (r0() - 0.5) * amp; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath(); ctx.fillStyle = 'rgba(38,34,29,0.16)'; ctx.fill();
  }
  for (let pass = 0; pass < (twice ? 2 : 1); pass++) {
    const r = rng(seed * 977 + boil * 131 + pass * 7919);
    const p = pts.map(([x, y]) => [x + (r() - 0.5) * 2 * amp, y + (r() - 0.5) * 2 * amp]);
    ctx.beginPath();
    if (closed) {
      const n = p.length, m = (i) => [(p[i][0] + p[(i + 1) % n][0]) / 2, (p[i][1] + p[(i + 1) % n][1]) / 2];
      const st = m(n - 1); ctx.moveTo(st[0], st[1]);
      for (let i = 0; i < n; i++) { const e = m(i); ctx.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
      ctx.closePath();
    } else {
      ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
      ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
    }
    if (fill && pass === 0) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.lineWidth = width * (pass ? 0.55 : 1); ctx.strokeStyle = color; ctx.lineJoin = ctx.lineCap = 'round'; ctx.stroke();
  }
}
function capsulePts(w, h) {
  const r = Math.min(w, h) / 2 * 0.92, pts = [], hw = w / 2 - r, hh = h / 2 - r;
  for (const [cx, cy, a0] of [[hw, -hh, -90], [hw, hh, 0], [-hw, hh, 90], [-hw, -hh, 180]])
    for (let i = 0; i <= 3; i++) { const a = (a0 + i * 30) * Math.PI / 180; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function circlePts(r, n = 14) { return Array.from({ length: n }, (_, i) => [Math.cos(i / n * 6.283) * r, Math.sin(i / n * 6.283) * r]); }
function toWorld(tf, pts) { const c = Math.cos(tf.a), si = Math.sin(tf.a); return pts.map(([x, y]) => [tf.x + x * c - y * si, tf.y + x * si + y * c]); }
const tfOf = (b) => ({ x: b.position.x, y: b.position.y, a: b.angle });

// ---------- 世界 ----------
function buildWorld() {
  engine = Engine.create(); engine.gravity.y = 1; parts = []; props = []; pins = []; grips = []; drag = null;
  const t = 300, st = { isStatic: true, friction: 1 };
  Composite.add(engine.world, [Bodies.rectangle(SW / 2, FLOOR + t / 2, SW + 600, t, st), Bodies.rectangle(-t / 2, SH / 2, t, SH * 3, st),
    Bodies.rectangle(SW + t / 2, SH / 2, t, SH * 3, st), Bodies.rectangle(SW / 2, -t / 2 - 200, SW + 600, t, st)]);
  makeDoll(SW / 2, 410); makeProps();
}
function makeDoll(cx, cy) {
  const g = { collisionFilter: { group: -1 }, frictionAir: 0.035, friction: 0.9, restitution: 0.05, density: 0.0018 };
  const P = (name, body) => { body.label = name; parts.push({ body, name }); return body; };
  const head = P('head', Bodies.circle(cx, cy - 118, 36, g));
  const chest = P('chest', Bodies.rectangle(cx, cy - 45, 62, 74, { ...g, chamfer: { radius: 20 } }));
  const pelvis = P('pelvis', Bodies.rectangle(cx, cy + 16, 56, 44, { ...g, chamfer: { radius: 16 } }));
  const limb = (name, x, y, w, h) => P(name, Bodies.rectangle(x, y, w, h, { ...g, chamfer: { radius: w / 2 - 1 } }));
  const uaL = limb('uaL', cx - 44, cy - 42, 20, 62), faL = limb('faL', cx - 44, cy + 16, 18, 60);
  const uaR = limb('uaR', cx + 44, cy - 42, 20, 62), faR = limb('faR', cx + 44, cy + 16, 18, 60);
  const thL = limb('thL', cx - 16, cy + 72, 24, 70), shL = limb('shL', cx - 16, cy + 138, 20, 70);
  const thR = limb('thR', cx + 16, cy + 72, 24, 70), shR = limb('shR', cx + 16, cy + 138, 20, 70);
  const js = [];
  const J = (a, pa, b, pb) => js.push(Constraint.create({ bodyA: a, pointA: pa, bodyB: b, pointB: pb, length: 0, stiffness: 0.95, damping: 0.15 }));
  J(head, { x: 0, y: 34 }, chest, { x: 0, y: -37 }); J(chest, { x: 0, y: 35 }, pelvis, { x: 0, y: -20 });
  J(chest, { x: -32, y: -26 }, uaL, { x: 0, y: -26 }); J(uaL, { x: 0, y: 28 }, faL, { x: 0, y: -26 });
  J(chest, { x: 32, y: -26 }, uaR, { x: 0, y: -26 }); J(uaR, { x: 0, y: 28 }, faR, { x: 0, y: -26 });
  J(pelvis, { x: -15, y: 16 }, thL, { x: 0, y: -30 }); J(thL, { x: 0, y: 32 }, shL, { x: 0, y: -31 });
  J(pelvis, { x: 15, y: 16 }, thR, { x: 0, y: -30 }); J(thR, { x: 0, y: 32 }, shR, { x: 0, y: -31 });
  Composite.add(engine.world, [...parts.map(p => p.body), ...js]);
  addPin(head, { x: 0, y: -26 });
}
function makeProps() {
  const spots = [190, 790, 900];
  propIds.forEach((pid, k) => {
    const def = PROPS[pid], x = spots[k], y = 300;
    const ps = def.build(x, y);
    const body = ps.length > 1 ? Body.create({ parts: ps }) : ps[0];
    Body.set(body, { frictionAir: 0.02, friction: 0.9, restitution: 0.15 }); Body.setDensity(body, 0.001);
    const off = { x: x - body.position.x, y: y - body.position.y }; // 飾りの基準点（重心からのずれ）
    body.isProp = true; body.label = 'prop' + k;
    // 床の上に置く
    const minY = Math.max(...body.vertices.map(v => v.y)); Body.setPosition(body, { x: body.position.x, y: body.position.y + (FLOOR - 2 - minY) });
    props.push({ body, def, off });
    Composite.add(engine.world, body);
  });
}

// ---------- 保存（コマ）とリンク ----------
function liveView() {
  return { tf: [...PART_NAMES.map(n => tfOf(parts.find(p => p.name === n).body)), ...props.map(p => tfOf(p.body))],
    face, pins: pins.map(c => ({ x: c.pointA.x, y: c.pointA.y })) };
}
function snapshot() {
  const v = liveView();
  return { tf: v.tf.map(t => ({ x: Math.round(t.x), y: Math.round(t.y), a: Math.round(t.a * 100) / 100 })), face, pins: v.pins.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })) };
}
const SCR = [0x5b, 0x1f, 0xa7, 0x33, 0xc9, 0x6e, 0x81, 0x24];
function scramble(text) {
  const b = new TextEncoder().encode(text).map((v, i) => v ^ SCR[i % SCR.length]);
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unscramble(code) {
  const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
  return new TextDecoder().decode(Uint8Array.from(bin, (c, i) => c.charCodeAt(0) ^ SCR[i % SCR.length]));
}
function encodeBoke() {
  const nums = [frames.length];
  for (const f of frames) {
    nums.push(FACES.findIndex(x => x[0] === f.face), f.pins.length);
    f.pins.forEach(p => nums.push(p.x, p.y));
    f.tf.forEach(t => nums.push(t.x, t.y, Math.round(t.a * 100)));
  }
  return ['4', scramble(caption), [scene, ...propIds].join('.'), nums.join('.')].join('~');
}
function decodeBoke(str) {
  try {
    const [v, cap, meta, rest] = str.split('~'); if (v !== '4') return null;
    const [sc, ...ids] = meta.split('.').map(Number);
    if (!SCENES[sc] || ids.length !== 3 || ids.some(i => !PROPS[i])) return null;
    const a = rest.split('.').map(Number); let i = 0; const n = a[i++]; if (!(n >= 1 && n <= MAX_FRAMES)) return null;
    const fs = [];
    for (let f = 0; f < n; f++) {
      const fc = (FACES[a[i++]] || FACES[0])[0], np = a[i++], pa = [];
      for (let k = 0; k < np; k++) pa.push({ x: a[i++], y: a[i++] });
      const tf = []; for (let k = 0; k < 14; k++) tf.push({ x: a[i++], y: a[i++], a: a[i++] / 100 });
      if (tf.some(t => isNaN(t.x) || isNaN(t.a))) return null;
      fs.push({ face: fc, pins: pa, tf });
    }
    return { caption: unscramble(cap), scene: sc, propIds: ids, frames: fs };
  } catch { return null; }
}
function decodeReply(str) { try { const [t, r] = str.split('~'); return { tsukkomi: unscramble(t), rating: Number(r) }; } catch { return null; } }

// ---------- 画びょう・つかむ・持たせる ----------
function addPin(body, offset) {
  if (pins.length >= MAX_PINS) removePin(pins[0]);
  const c = Constraint.create({ pointA: { x: body.position.x + offset.x, y: body.position.y + offset.y }, bodyB: body, pointB: { ...offset }, length: 0, stiffness: 0.9, damping: 0.2 });
  pins.push(c); Composite.add(engine.world, c);
}
function removePin(c) { pins = pins.filter(p => p !== c); Composite.remove(engine.world, c); }
function removeGrips(body) { grips.filter(g => g.bodyB === body).forEach(g => Composite.remove(engine.world, g)); grips = grips.filter(g => g.bodyB !== body); }
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s }; }
function endPoint(name, tf) { const [w, h, , end] = SHAPES[name]; const off = end === 'hand' ? [0, h / 2 + 4] : [5, h / 2 + 3]; const [[x, y]] = toWorld(tf, [off]); return { x, y }; }
function pick(m) {
  const front = [...FRONT].reverse().map(n => parts.find(p => p.name === n));
  const back = [...BACK].reverse().map(n => parts.find(p => p.name === n));
  const all = [...front, ...props, ...back];
  for (const p of [...front, ...back]) if (SHAPES[p.name][3] === 'hand' || SHAPES[p.name][3] === 'foot') { const e = endPoint(p.name, tfOf(p.body)); if (Math.hypot(e.x - m.x, e.y - m.y) < 20) return p.body; }
  for (const p of all) if (Query.point([p.body], m).length) return p.body;
  let best = null, bd = 24; // 細い棒（傘の柄など）もつかめるよう、ふちまでの距離で探す
  for (const p of all) { const d = distToBody(p.body, m); if (d < bd) { bd = d; best = p.body; } }
  return best;
}
function distToBody(b, m) {
  let best = Infinity;
  for (const part of (b.parts.length > 1 ? b.parts.slice(1) : [b])) {
    const vs = part.vertices;
    for (let i = 0; i < vs.length; i++) {
      const a = vs[i], c = vs[(i + 1) % vs.length], dx = c.x - a.x, dy = c.y - a.y, l2 = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((m.x - a.x) * dx + (m.y - a.y) * dy) / l2));
      best = Math.min(best, Math.hypot(m.x - (a.x + t * dx), m.y - (a.y + t * dy)));
    }
  }
  return best;

function hidePanel() { panel.style.display = 'none'; }
function setBar(html) { bar.innerHTML = html; layout(); }
const xIntent = (text, url) => window.open('https://twitter.com/intent/tweet?' + new URLSearchParams({ text, url }).toString(), '_blank', 'noopener');
function drawLots() { scene = Math.floor(Math.random() * SCENES.length); const ids = []; while (ids.length < 3) { const k = Math.floor(Math.random() * PROPS.length); if (!ids.includes(k)) ids.push(k); } propIds = ids; }

function goTitle() {
  state = 'title'; timerOn = false; frames = []; face = 'happy'; scene = 0; propIds = [12, 0, 4]; buildWorld();
  history.replaceState(null, '', location.pathname);
  showPanel(`<h1>物ボケ人形</h1>
    <p class="sub">ぐにゃぐにゃ人形と、ひいた道具で物ボケ。<br>リンクを送れば、友達がツッコんでくれる。</p>
    <div class="row"><button class="btn red" id="go">ボケる</button></div>
    <p class="sub" style="margin-top:12px">${POSE_SEC}秒で最大${MAX_FRAMES}コマ → タイトルをつける → 友達が${ANSWER_SEC}秒でツッコむ</p>
    <a class="home" href="../">← BLOCKYCLAW</a>`);
  setBar(''); $('#go').onclick = goChoose;
}
function goChoose() {
  state = 'choose'; frames = []; face = 'normal'; caption = ''; tsukkomi = ''; rating = -1; reveal = false; timerOn = false; reroll = 1;
  history.replaceState(null, '', location.pathname);
  drawLots(); buildWorld(); renderChoose();
}
function renderChoose() {
  showPanel(`<p class="sub">場面</p><p class="big">${esc(SCENES[scene][0])}</p>
    <p class="sub" style="margin-top:8px">道具</p><p class="big">${propIds.map(i => esc(PROPS[i].name)).join('・')}</p>
    <div class="row"><button class="btn red" id="start">これでボケる（${POSE_SEC}秒）</button><button class="btn" id="re" ${reroll ? '' : 'disabled'}>ひきなおす（${reroll}回）</button></div>`);
  setBar('');
  $('#start').onclick = goPose;
  $('#re').onclick = () => { if (!reroll) return; reroll--; drawLots(); buildWorld(); renderChoose(); };
}
function goPose() {
  state = 'pose'; timeLeft = POSE_SEC; timerOn = true; frames = []; hidePanel();
  setBar(`<div class="row faces">${FACES.map(([f, n]) => `<button class="btn ${f === face ? 'on' : ''}" data-f="${f}">${n}</button>`).join('')}</div>
    <div class="row"><button class="btn red" id="shot">コマを撮る（0/${MAX_FRAMES}）</button><button class="btn" id="done" disabled>できた！</button><button class="btn" id="unpin">画びょう全部ぬく</button></div>`);
  bar.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { face = b.dataset.f; bar.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x.dataset.f === face)); });
  $('#shot').onclick = shoot; $('#done').onclick = finishPose; $('#unpin').onclick = () => pins.slice().forEach(removePin);
}
function shoot() {
  if (state !== 'pose' || frames.length >= MAX_FRAMES) return;
  frames.push(snapshot()); flash = 0.7;
  $('#shot').textContent = `コマを撮る（${frames.length}/${MAX_FRAMES}）`; $('#done').disabled = false;
  if (frames.length >= MAX_FRAMES) finishPose();
}
function finishPose() {
  if (state !== 'pose') return;
  if (!frames.length) frames.push(snapshot());
  timerOn = false; drag = null; state = 'caption'; playStart = performance.now();
  setBar(`<form class="row" id="cf"><input class="inp" id="ci" maxlength="24" autocomplete="off" placeholder="ボケのタイトル（例：傘でゴルフする部長）"><button class="btn red">決定</button></form>`);
  $('#ci').oninput = () => { caption = $('#ci').value.trim(); };
  $('#cf').onsubmit = (e) => { e.preventDefault(); caption = $('#ci').value.trim(); if (!caption) { $('#ci').focus(); return; } goDone(); };
  $('#ci').focus();
}
function goDone() {
  state = 'done';
  const link = GAME_URL + '#p=' + encodeBoke();
  setBar(`<div class="row"><button class="btn red" id="xq">𝕏でツッコミ募集</button><button class="btn" id="local">この端末で友達に見せる</button></div>
    <div class="row"><button class="btn" id="copy">リンクをコピー</button><button class="btn" id="again">もう一回ボケる</button></div>`);
  $('#xq').onclick = () => xIntent(`【物ボケ人形】場面：${SCENES[scene][0]}　道具：${propNames()}\nこの物ボケに、ツッコんでください🙏\n#物ボケ人形`, link);
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(link); $('#copy').textContent = 'コピーした！'; } catch { prompt('このリンクを送ってね', link); } };
  $('#local').onclick = () => goAnswerIntro(true);
  $('#again').onclick = goChoose;
}
function goAnswerIntro(local) {
  state = 'answer'; reveal = false; timerOn = false; tsukkomi = ''; rating = -1; answerDone = false; setBar(''); playStart = performance.now();
  showPanel(`<p class="big">${local ? '友達にわたしてね' : 'ツッコミ募集中！'}</p>
    <p class="sub">場面：${esc(SCENES[scene][0])}　道具：${esc(propNames())}<br>${frames.length}コマの物ボケを見て、${ANSWER_SEC}秒でツッコミを書く。<br>そのあと、ボケのタイトルが明かされる。</p>
    <div class="row"><button class="btn red" id="st">見る</button></div>
    ${local ? '' : '<p class="sub" style="margin-top:10px"><a class="home" href="#" id="mine">自分もボケる</a></p>'}`);
  $('#st').onclick = startAnswer;
  if (!local) $('#mine').onclick = (e) => { e.preventDefault(); goChoose(); };
}
function startAnswer() {
  hidePanel(); playStart = performance.now();
  setBar(`<form class="row" id="tf"><input class="inp" id="ti" maxlength="30" autocomplete="off" placeholder="ツッコミを書く（例：それ傘や！）"><button class="btn red">ツッコむ</button></form>`);
  $('#tf').onsubmit = (e) => { e.preventDefault(); const v = $('#ti').value.trim(); if (!v) return; submitTsukkomi(v); };
  $('#ti').focus();
  timeLeft = ANSWER_SEC; timerOn = true;
}
function submitTsukkomi(v) {
  if (answerDone) return; answerDone = true; timerOn = false; tsukkomi = v || '……（言葉が出ない）'; reveal = true; flash = 0.4;
  setBar(`<div class="msg">ボケのタイトルは「${esc(caption)}」。どうだった？</div>
    <div class="row">${RATINGS.map(([n, e], i) => `<button class="btn" data-r="${i}">${e} ${n}</button>`).join('')}</div>`);
  bar.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rate(Number(b.dataset.r)));
}
function rate(r) {
  rating = r; flash = 0.3;
  const back = GAME_URL + '#p=' + encodeBoke() + '&r=' + scramble(tsukkomi) + '~' + r;
  const link = GAME_URL + '#p=' + encodeBoke();
  setBar(`<div class="row"><button class="btn red" id="ret">ボケた人にツッコミを返す</button><button class="btn" id="xs">𝕏で言う</button><button class="btn" id="mine">自分もボケる</button></div>`);
  $('#ret').onclick = async () => { try { await navigator.clipboard.writeText(back); $('#ret').textContent = 'リンクをコピーした！ 送ってね'; } catch { prompt('このリンクをボケた人に送ってね', back); } };
  $('#xs').onclick = () => xIntent(`【物ボケ人形】ボケ「${caption}」\nわたしのツッコミ：「${tsukkomi}」→ ${RATINGS[r][1]}${RATINGS[r][0]}\n#物ボケ人形`, link);
  $('#mine').onclick = goChoose;
}
function goReply(rp) {
  state = 'reply'; reveal = true; tsukkomi = rp.tsukkomi; rating = RATINGS[rp.rating] ? rp.rating : -1; timerOn = false; playStart = performance.now();
  setBar(`<div class="msg">あなたのボケに、ツッコミが届いた！</div><div class="row"><button class="btn red" id="mine">もう一回ボケる</button></div>`);
  $('#mine').onclick = goChoose;
}

// ---------- ループ ----------
let last = 0;
function loop(t) {
  const dt = Math.min(t - last, 33); last = t;
  if (state === 'pose' || state === 'title' || state === 'choose') Engine.update(engine, dt);
  boil = Math.floor(t / 130); flash = Math.max(0, flash - dt / 250);
  if (timerOn) {
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) { timeLeft = 0; if (state === 'pose') finishPose(); else if (state === 'answer') submitTsukkomi(($('#ti') && $('#ti').value.trim()) || ''); }
  }
  draw(); requestAnimationFrame(loop);
}
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const reserve = bar.offsetHeight ? bar.offsetHeight + 20 : 16;
  s = Math.min(W / SW, (H - reserve) / SH); ox = (W - SW * s) / 2; oy = Math.max(0, (H - reserve - SH * s) / 2);
}
addEventListener('resize', layout);
function start() {
  if (!innerWidth || !innerHeight) { setTimeout(start, 100); return; }
  makeGrain(); layout();
  const hp = new URLSearchParams(location.hash.slice(1)), d = hp.get('p') && decodeBoke(hp.get('p'));
  if (d) {
    caption = d.caption; scene = d.scene; propIds = d.propIds; frames = d.frames; buildWorld();
    const rp = hp.get('r') && decodeReply(hp.get('r'));
    if (rp) goReply(rp); else goAnswerIntro(false);
  } else goTitle();
  last = performance.now(); requestAnimationFrame(loop);
}
start();
window.__boke = { get state() { return state; }, get frames() { return frames; }, get props() { return props; }, get parts() { return parts; }, get grips() { return grips; },
  shoot, finishPose, encodeBoke, decodeBoke, goPose, scramble, setScene: (sc, ids) => { scene = sc; propIds = ids; buildWorld(); } };
</script>
</body>
</html>
