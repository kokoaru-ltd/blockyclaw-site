    padding: 20px 22px; width: min(440px, calc(100vw - 48px)); text-align: center; display: none; }
  #panel h1 { font-size: 34px; margin: 0 0 4px; font-weight: 400; }

<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="bar"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Constraint, Query } = Matter;
const INK = '#26221d', PAPER = '#f3eee2', SKIN = '#fffdf6', RED = '#d8432e';
const SW = 1000, SH = 720, FLOOR = 650;
const MAX_PINS = 5, MAX_FRAMES = 4, POSE_SEC = 45, ANSWER_SEC = 25, FRAME_MS = 520;
const GAME_URL = 'https://kokoaru-ltd.github.io/blockyclaw-site/nannopose/';
// お題と、答えとして認める言い方
const ODAI = [
  ['歯医者', 'はいしゃ,しか,歯科,歯科医,歯医者さん'], ['満員電車', 'まんいんでんしゃ,通勤電車,つうきんでんしゃ,満員'], ['金魚すくい', 'きんぎょすくい,金魚掬い,金魚'],
  ['土下座', 'どげざ'], ['バンジージャンプ', 'ばんじー,バンジー'], ['自撮り', 'じどり,セルフィー,自撮'], ['寝坊した朝', 'ねぼう,寝坊,遅刻,ちこく'],
  ['フラミンゴ', ''], ['ぎっくり腰', 'ぎっくりごし,腰痛,ようつう'], ['一本釣り', 'いっぽんづり,釣り,つり,魚釣り'], ['盆踊り', 'ぼんおどり,盆踊'],
  ['ボウリング', 'ボーリング'], ['犬の散歩', 'いぬのさんぽ,散歩,さんぽ'], ['つり革', 'つりかわ,吊り革,吊革'], ['足がつった', 'あしがつった,こむら返り,こむらがえり,足つった'],
  ['サーフィン', '波乗り,なみのり'], ['忍者', 'にんじゃ'], ['ゾンビ', ''], ['ラジオ体操', 'らじおたいそう,体操,たいそう'], ['タクシーを止める', 'タクシー'],
  ['蚊をたたく', '蚊,蚊を叩く,かをたたく'], ['スキージャンプ', 'スキー,ジャンプ'], ['居眠り', 'いねむり,寝る,ねる,昼寝'], ['UFOにさらわれる', 'UFO,ゆーふぉー,宇宙人,うちゅうじん'],
  ['ホームラン', '野球,やきゅう,バッター'], ['ヨガ', ''], ['相撲', 'すもう,力士,りきし'], ['カンフー', '拳法,けんぽう'], ['やり投げ', 'やりなげ,槍投げ'],
  ['雪かき', 'ゆきかき,除雪,じょせつ'], ['綱引き', 'つなひき'], ['逆立ち', 'さかだち'], ['腕相撲', 'うでずもう'], ['ゴルフ', ''], ['卓球', 'たっきゅう,ピンポン'],
  ['バレエ', 'バレリーナ'], ['ロボットダンス', 'ロボット'], ['いないいないばあ', 'いないいないばー,いないいないばぁ'], ['お辞儀', 'おじぎ'], ['ガッツポーズ', ''],
  ['幽霊', 'ゆうれい,おばけ,お化け'], ['かかし', '案山子'], ['雷に打たれる', 'かみなり,雷,感電,かんでん'], ['バナナで滑る', 'バナナ,滑る,すべる'], ['おならを我慢', 'おなら,我慢,がまん'],
  ['虫から逃げる', '虫,むし,ゴキブリ'], ['ゴール！', 'ゴール,サッカー'], ['コマネチ', ''], ['ハイタッチ', ''], ['重い荷物', 'おもいにもつ,荷物,にもつ,引っ越し'],
  ['弓矢', 'ゆみや,弓,ゆみ,アーチェリー'], ['大物が釣れた', '大物,おおもの,魚,さかな'], ['カメラマン', 'カメラ,写真,しゃしん'], ['指揮者', 'しきしゃ,指揮'], ['ピアノ', ''],
  ['ギター', ''], ['ドラム', '太鼓,たいこ'], ['マラソンのゴール', 'マラソン,まらそん'], ['木登り', 'きのぼり'], ['ジャンケン負け', 'じゃんけん,ジャンケン']];
const FACES = [['normal','ふつう'],['happy','にこにこ'],['sad','かなしい'],['angry','おこ'],['surprise','びっくり'],['sleepy','ねむい'],['pain','いたい'],['dead','×_×']];
const PART_NAMES = ['head', 'chest', 'pelvis', 'uaL', 'faL', 'uaR', 'faR', 'thL', 'shL', 'thR', 'shR'];
const ORDER = ['uaL', 'faL', 'thL', 'shL', 'pelvis', 'chest', 'head', 'thR', 'shR', 'uaR', 'faR'];
const SHAPES = { head: [72, 72, 1, 'round'], chest: [62, 74, 2], pelvis: [56, 44, 3], uaL: [20, 62, 4], faL: [18, 60, 5, 'hand'], uaR: [20, 62, 6],
  faR: [18, 60, 7, 'hand'], thL: [24, 70, 8], shL: [20, 70, 9, 'foot'], thR: [24, 70, 10], shR: [20, 70, 11, 'foot'] };
const PROP_SHAPES = [[60, 60, 21, 'round'], [78, 62, 22], [14, 190, 23]];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const panel = document.getElementById('panel'), bar = document.getElementById('bar');
let W, H, DPR, s = 1, ox = 0, oy = 0;
let engine, parts = [], props = [], pins = [], drag = null, grain;
let state = 'title', odai = { t: '', alts: [] }, face = 'normal', timeLeft = 0, timerOn = false, reveal = false, hideOdai = false;
let frames = [], playStart = 0, flash = 0, answerStartAt = 0, answerDone = false, tries = [];

// ---------- 手描き風の線 ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let boil = 0;
function sketch(pts, seed, { closed = true, fill = null, width = 3, amp = 1.5, twice = true } = {}) {
  for (let pass = 0; pass < (twice ? 2 : 1); pass++) {
    const r = rng(seed * 977 + boil * 131 + pass * 7919);
    const p = pts.map(([x, y]) => [x + (r() - 0.5) * 2 * amp, y + (r() - 0.5) * 2 * amp]);
    ctx.beginPath();
    if (closed) {
      const n = p.length, m = (i) => [(p[i][0] + p[(i + 1) % n][0]) / 2, (p[i][1] + p[(i + 1) % n][1]) / 2];
      const st = m(n - 1); ctx.moveTo(st[0], st[1]);
      for (let i = 0; i < n; i++) { const e = m(i); ctx.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
      ctx.closePath();
    } else {
      ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
      ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
    }
    if (fill && pass === 0) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.lineWidth = width * (pass ? 0.55 : 1); ctx.strokeStyle = INK; ctx.lineJoin = ctx.lineCap = 'round'; ctx.stroke();
  }
}
function capsulePts(w, h) {
  const r = Math.min(w, h) / 2 * 0.92, pts = [], hw = w / 2 - r, hh = h / 2 - r;
  for (const [cx, cy, a0] of [[hw, -hh, -90], [hw, hh, 0], [-hw, hh, 90], [-hw, -hh, 180]])
    for (let i = 0; i <= 3; i++) { const a = (a0 + i * 30) * Math.PI / 180; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function circlePts(r, n = 14) { return Array.from({ length: n }, (_, i) => [Math.cos(i / n * 6.283) * r, Math.sin(i / n * 6.283) * r]); }
// tf = { x, y, a }
function toWorld(tf, pts) { const c = Math.cos(tf.a), si = Math.sin(tf.a); return pts.map(([x, y]) => [tf.x + x * c - y * si, tf.y + x * si + y * c]); }
const tfOf = (b) => ({ x: b.position.x, y: b.position.y, a: b.angle });

// ---------- 物理の世界（出題中だけ使う） ----------
function buildWorld() {
  engine = Engine.create(); engine.gravity.y = 1; parts = []; props = []; pins = []; drag = null;
  const t = 300, st = { isStatic: true, friction: 1 };
  Composite.add(engine.world, [Bodies.rectangle(SW / 2, FLOOR + t / 2, SW + 600, t, st), Bodies.rectangle(-t / 2, SH / 2, t, SH * 3, st),
    Bodies.rectangle(SW + t / 2, SH / 2, t, SH * 3, st), Bodies.rectangle(SW / 2, -t / 2 - 200, SW + 600, t, st)]);
  makeDoll(SW / 2, 400); makeProps();
}
function makeDoll(cx, cy) {
  const g = { collisionFilter: { group: -1 }, frictionAir: 0.035, friction: 0.9, restitution: 0.05, density: 0.0018 };
  const P = (name, body) => { body.label = name; parts.push({ body, name }); return body; };
  const head = P('head', Bodies.circle(cx, cy - 118, 36, g));
  const chest = P('chest', Bodies.rectangle(cx, cy - 45, 62, 74, { ...g, chamfer: { radius: 20 } }));
  const pelvis = P('pelvis', Bodies.rectangle(cx, cy + 16, 56, 44, { ...g, chamfer: { radius: 16 } }));
  const limb = (name, x, y, w, h) => P(name, Bodies.rectangle(x, y, w, h, { ...g, chamfer: { radius: w / 2 - 1 } }));
  const uaL = limb('uaL', cx - 44, cy - 42, 20, 62), faL = limb('faL', cx - 44, cy + 16, 18, 60);
  const uaR = limb('uaR', cx + 44, cy - 42, 20, 62), faR = limb('faR', cx + 44, cy + 16, 18, 60);
  const thL = limb('thL', cx - 16, cy + 72, 24, 70), shL = limb('shL', cx - 16, cy + 138, 20, 70);
  const thR = limb('thR', cx + 16, cy + 72, 24, 70), shR = limb('shR', cx + 16, cy + 138, 20, 70);
  const js = [];
  const J = (a, pa, b, pb) => js.push(Constraint.create({ bodyA: a, pointA: pa, bodyB: b, pointB: pb, length: 0, stiffness: 0.95, damping: 0.15 }));
  J(head, { x: 0, y: 34 }, chest, { x: 0, y: -37 }); J(chest, { x: 0, y: 35 }, pelvis, { x: 0, y: -20 });
  J(chest, { x: -32, y: -26 }, uaL, { x: 0, y: -26 }); J(uaL, { x: 0, y: 28 }, faL, { x: 0, y: -26 });
  J(chest, { x: 32, y: -26 }, uaR, { x: 0, y: -26 }); J(uaR, { x: 0, y: 28 }, faR, { x: 0, y: -26 });
  J(pelvis, { x: -15, y: 16 }, thL, { x: 0, y: -30 }); J(thL, { x: 0, y: 32 }, shL, { x: 0, y: -31 });
  J(pelvis, { x: 15, y: 16 }, thR, { x: 0, y: -30 }); J(thR, { x: 0, y: 32 }, shR, { x: 0, y: -31 });
  Composite.add(engine.world, [...parts.map(p => p.body), ...js]);
  addPin(head, { x: 0, y: -26 });
}
function makeProps() {
  const o = { frictionAir: 0.02, friction: 0.9, restitution: 0.2, density: 0.001 };
  const add = (body) => { body.isProp = true; props.push({ body }); Composite.add(engine.world, body); };
  add(Bodies.circle(250, FLOOR - 31, 30, o));
  add(Bodies.rectangle(760, FLOOR - 32, 78, 62, { ...o, chamfer: { radius: 6 } }));
  add(Bodies.rectangle(660, FLOOR - 96, 14, 190, { ...o, chamfer: { radius: 6 } }));
}

// ---------- コマ（1枚の絵）＝ 体14個の位置と角度・表情・画びょう ----------
function liveView() {
  return { tf: [...PART_NAMES.map(n => tfOf(parts.find(p => p.name === n).body)), ...props.map(p => tfOf(p.body))],
    face, pins: pins.map(c => ({ x: c.pointA.x, y: c.pointA.y })) };
}
function snapshot() {
  const v = liveView();
  return { tf: v.tf.map(t => ({ x: Math.round(t.x), y: Math.round(t.y), a: Math.round(t.a * 100) / 100 })), face, pins: v.pins.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })) };
}
// お題の文字は、リンクを見ただけでは読めないように混ぜてから入れる
const SCR = [0x5b, 0x1f, 0xa7, 0x33, 0xc9, 0x6e, 0x81, 0x24];
function scramble(text) {
  const b = new TextEncoder().encode(text).map((v, i) => v ^ SCR[i % SCR.length]);
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unscramble(code) {
  const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
  const b = Uint8Array.from(bin, (c, i) => c.charCodeAt(0) ^ SCR[i % SCR.length]);
  return new TextDecoder().decode(b);
}
function encodeFrames() {
  const nums = [frames.length];
  for (const f of frames) {
    nums.push(FACES.findIndex(x => x[0] === f.face), f.pins.length);
    f.pins.forEach(p => nums.push(p.x, p.y));
    f.tf.forEach(t => nums.push(t.x, t.y, Math.round(t.a * 100)));
  }
  return ['3', scramble(odai.t), scramble(odai.alts.join(',')), nums.join('.')].join('~');
}
function readFrames(a, i) {
  const n = a[i++]; if (!(n >= 1 && n <= MAX_FRAMES)) return null;
  const fs = [];
  for (let f = 0; f < n; f++) {
    const fc = (FACES[a[i++]] || FACES[0])[0], np = a[i++], pinsArr = [];
    for (let k = 0; k < np; k++) pinsArr.push({ x: a[i++], y: a[i++] });
    const tf = []; for (let k = 0; k < 14; k++) tf.push({ x: a[i++], y: a[i++], a: a[i++] / 100 });
    if (tf.some(t => isNaN(t.x) || isNaN(t.a))) return null;
    fs.push({ face: fc, pins: pinsArr, tf });
  }
  return fs;
}
function decodeFrames(str) {
  try {
    if (str.startsWith('3~')) { // 自由入力のお題
      const [, p, al, rest] = str.split('~');
      const t = unscramble(p).trim(); if (!t) return null;
      const fs = readFrames(rest.split('.').map(Number), 0); if (!fs) return null;
      return { odai: { t, alts: unscramble(al || '').split(',').map(x => x.trim()).filter(Boolean) }, frames: fs };
    }
    const a = str.split('.').map(Number); if (a.some(isNaN) || a[0] !== 2) return null; // 前の版のリンク
    let idx = -1; for (let k = 0; k < ODAI.length; k++) if ((k * 7 + 13) % 997 === a[1]) idx = k;
    const fs = readFrames(a, 2); if (idx < 0 || !fs) return null;
    return { odai: { t: ODAI[idx][0], alts: [] }, frames: fs };
  } catch { return null; }
}

// ---------- 画びょう・つかむ ----------
function addPin(body, offset) {
  if (pins.length >= MAX_PINS) removePin(pins[0]);
  const c = Constraint.create({ pointA: { x: body.position.x + offset.x, y: body.position.y + offset.y }, bodyB: body, pointB: { ...offset }, length: 0, stiffness: 0.9, damping: 0.2 });
  pins.push(c); Composite.add(engine.world, c);
}
function removePin(c) { pins = pins.filter(p => p !== c); Composite.remove(engine.world, c); }
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s }; }
function endPoint(name, tf) { const [w, h, , end] = SHAPES[name]; const off = end === 'hand' ? [0, h / 2 + 4] : [5, h / 2 + 3]; const [[x, y]] = toWorld(tf, [off]); return { x, y }; }
function pick(m) {
  const front = [...ORDER].reverse().map(n => parts.find(p => p.name === n));
  for (const p of front) if (SHAPES[p.name][3] === 'hand' || SHAPES[p.name][3] === 'foot') { const e = endPoint(p.name, tfOf(p.body)); if (Math.hypot(e.x - m.x, e.y - m.y) < 20) return p.body; }
  for (const p of [...front, ...props]) if (Query.point([p.body], m).length) return p.body;
  let best = null, bd = 22;
  for (const p of [...front, ...props]) for (const v of p.body.vertices) { const d = Math.hypot(v.x - m.x, v.y - m.y); if (d < bd) { bd = d; best = p.body; } }
  return best;
}
function startDrag(body, anchor, m, e, fromPin) {
  const c = Constraint.create({ pointA: { ...m }, bodyB: body, pointB: { x: anchor.x - body.position.x, y: anchor.y - body.position.y }, length: 0, stiffness: 0.6, damping: 0.25 });
  Composite.add(engine.world, c);
  drag = { c, body, fromPin, x0: m.x, y0: m.y, t0: performance.now(), moved: false };
  cv.setPointerCapture(e.pointerId);
}
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'pose') return;
  const m = pos(e);
  const hit = pins.find(p => Math.hypot(p.pointA.x - m.x, p.pointA.y - m.y) < 16);
  if (hit) { const body = hit.bodyB, a = { ...hit.pointA }; removePin(hit); startDrag(body, a, m, e, true); return; }
  const body = pick(m); if (!body) return;
  pins.filter(p => p.bodyB === body).forEach(removePin);
  startDrag(body, m, m, e, false);
});
cv.addEventListener('pointermove', (e) => { if (!drag) return; const m = pos(e); drag.c.pointA = m; if (Math.hypot(m.x - drag.x0, m.y - drag.y0) > 6) drag.moved = true; });
function release() {
  if (!drag) return;
  const { c, body, fromPin, moved, t0 } = drag; Composite.remove(engine.world, c); drag = null;
  if (state !== 'pose') return;
  if (fromPin && !moved && performance.now() - t0 < 400) return;
  if (!body.isProp) addPin(body, { x: c.pointB.x, y: c.pointB.y });
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

// ---------- 描画 ----------
function makeGrain() {
  grain = document.createElement('canvas'); grain.width = grain.height = 256;
  const g = grain.getContext('2d'), d = g.createImageData(256, 256), r = rng(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() < 0.5 ? 0 : 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = r() * 16; }
  g.putImageData(d, 0, 0);
}
function drawRoom() {
  sketch([[-40, FLOOR], [SW * 0.3, FLOOR + 2], [SW * 0.62, FLOOR - 1], [SW + 40, FLOOR + 1]], 50, { closed: false, width: 3.2, amp: 1.2 });
  const r = rng(77);
  for (let i = 0; i < 9; i++) { const x = r() * SW, y = FLOOR + 14 + r() * 40, l = 20 + r() * 60;
    sketch([[x, y], [x + l / 2, y + 1], [x + l, y]], 60 + i, { closed: false, width: 1.6, amp: 0.8, twice: false }); }
  ctx.globalAlpha = 0.45;
  const wx = 90, wy = 190;
  sketch([[wx, wy], [wx + 60, wy], [wx + 120, wy], [wx + 120, wy + 75], [wx + 120, wy + 150], [wx + 60, wy + 150], [wx, wy + 150], [wx, wy + 75]], 70, { width: 2.2, amp: 1.2 });
  sketch([[wx + 60, wy], [wx + 61, wy + 75], [wx + 60, wy + 150]], 71, { closed: false, width: 1.8, twice: false });
  sketch([[wx, wy + 75], [wx + 60, wy + 76], [wx + 120, wy + 75]], 72, { closed: false, width: 1.8, twice: false });
  const kx = 880, ky = 230;
  sketch(circlePts(34).map(([x, y]) => [kx + x, ky + y]), 73, { width: 2.2, amp: 1.2 });
  sketch([[kx, ky], [kx + 1, ky - 12], [kx, ky - 22]], 74, { closed: false, width: 2, twice: false });
  sketch([[kx, ky], [kx + 8, ky + 3], [kx + 15, ky + 6]], 75, { closed: false, width: 2, twice: false });
  ctx.globalAlpha = 1;
}
function drawShape(tf, w, h, seed, kind) {
  sketch(toWorld(tf, kind === 'round' ? circlePts(w / 2) : capsulePts(w, h)), seed, { fill: SKIN, width: 3.2 });
  if (kind === 'hand' || kind === 'foot') {
    const off = kind === 'hand' ? [0, h / 2 + 4] : [5, h / 2 + 3];
    const shape = kind === 'hand' ? circlePts(12, 10) : capsulePts(34, 20);
    sketch(toWorld(tf, shape.map(([x, y]) => [x + off[0], y + off[1]])), seed + 100, { fill: SKIN, width: 3 });
  }
}
function drawView(v) {
  PROP_SHAPES.forEach(([w, h, seed, kind], k) => drawShape(v.tf[11 + k], w, h, seed, kind));
  for (const n of ORDER) { const [w, h, seed, kind] = SHAPES[n], tf = v.tf[PART_NAMES.indexOf(n)]; drawShape(tf, w, h, seed, kind); if (n === 'head') drawFace(tf, v.face); }
  v.pins.forEach((p, k) => drawTack(p, 1, 90 + k));
}
function drawFace(tf, fc) {
  const L = (pts, seed, o) => sketch(toWorld(tf, pts), seed, { closed: false, width: 2.8, amp: 0.6, twice: false, ...o });
  const dot = (x, y, r = 3.4) => { const [[px, py]] = toWorld(tf, [[x, y]]); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, r, 0, 6.3); ctx.fill(); };
  const ring = (x, y, r, seed) => sketch(toWorld(tf, circlePts(r, 9).map(([a, c]) => [a + x, c + y])), seed, { width: 2.4, amp: 0.5, twice: false });
  switch (fc) {
    case 'happy': L([[-17, -3], [-12, -9], [-7, -3]], 31); L([[7, -3], [12, -9], [17, -3]], 32);
      sketch(toWorld(tf, [[-11, 8], [0, 8], [11, 8], [7, 17], [0, 20], [-7, 17]]), 33, { fill: INK, width: 2.4, amp: 0.4, twice: false }); break;
    case 'sad': dot(-12, -3); dot(12, -3); L([[-19, -13], [-12, -16], [-6, -12]], 34); L([[6, -12], [12, -16], [19, -13]], 35);
      L([[-8, 16], [0, 11], [8, 16]], 36); sketch(toWorld(tf, [[-15, 3], [-13, 9], [-15, 12], [-17, 9]]), 37, { width: 1.8, amp: 0.3, twice: false }); break;
    case 'angry': dot(-12, -2); dot(12, -2); L([[-19, -14], [-11, -9], [-5, -7]], 38); L([[5, -7], [11, -9], [19, -14]], 39);
      L([[-9, 15], [-3, 12], [3, 15], [9, 12]], 40); break;
    case 'surprise': ring(-12, -4, 6, 41); ring(12, -4, 6, 42); dot(-12, -4, 2); dot(12, -4, 2); ring(0, 14, 6, 43); break;
    case 'sleepy': L([[-18, -3], [-12, -1], [-6, -3]], 44); L([[6, -3], [12, -1], [18, -3]], 45); ring(0, 13, 3.5, 46);
      { ctx.fillStyle = INK; const [[zx, zy]] = toWorld(tf, [[28, -30]]); ctx.font = '18px Yomogi, sans-serif'; ctx.fillText('z', zx, zy); ctx.font = '13px Yomogi, sans-serif'; ctx.fillText('z', zx + 12, zy - 12); } break;
    case 'pain': L([[-18, -8], [-10, -4], [-18, 0]], 47); L([[18, -8], [10, -4], [18, 0]], 48);
      L([[-10, 13], [-5, 10], [0, 14], [5, 10], [10, 13]], 49); L([[22, -16], [25, -6]], 50, { width: 2 }); break;
    case 'dead': L([[-17, -9], [-8, 1]], 51); L([[-8, -9], [-17, 1]], 52); L([[8, -9], [17, 1]], 53); L([[17, -9], [8, 1]], 54);
      L([[-8, 13], [8, 13]], 55); sketch(toWorld(tf, [[3, 13], [9, 13], [8, 20], [4, 20]]), 56, { fill: RED, width: 2, amp: 0.3, twice: false }); break;
    default: dot(-12, -5); dot(12, -5); L([[-8, 12], [0, 15], [8, 12]], 57);
  }
  L([[-6, -35], [-2, -46], [3, -39]], 58); L([[3, -36], [9, -47], [13, -38]], 59);
}
function drawTack(p, alpha = 1, seed = 90) {
  ctx.globalAlpha = alpha;
  sketch(circlePts(9, 9).map(([px, py]) => [p.x + px, p.y + py]), seed, { fill: RED, width: 2.4, amp: 0.8, twice: false });
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(p.x - 3, p.y - 3, 2.4, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1;
}
function drawOdaiCard() {
  if (state === 'title' || state === 'choose') return;
  const w = 520, x = SW / 2 - w / 2, y = 18, h = 92;
  ctx.save(); ctx.translate(SW / 2, y + h / 2); ctx.rotate(-0.012); ctx.translate(-SW / 2, -(y + h / 2));
  sketch([[x, y], [x + w / 2, y - 2], [x + w, y], [x + w + 2, y + h / 2], [x + w, y + h], [x + w / 2, y + h + 2], [x, y + h], [x - 2, y + h / 2]], 80, { fill: SKIN, width: 2.6, amp: 1 });
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const hidden = (state === 'answer' && !reveal) || hideOdai;
  ctx.font = '17px Yomogi, sans-serif'; ctx.fillText(hidden ? 'この動き、なんのお題？' : 'お題', SW / 2, y + 22);
  let text = odai.t;
  if (hidden) { // ヒント：時間がたつと文字数 → 1文字目
    const el = state === 'answer' && timerOn ? ANSWER_SEC - timeLeft : 0;
    const ch = [...text]; // 絵文字なども1文字として数える
    text = el >= 16 ? ch[0] + '〇'.repeat(ch.length - 1) : el >= 8 ? '〇'.repeat(ch.length) : '？？？';
  }
  let fs = 40; ctx.font = `${fs}px Yomogi, sans-serif`;
  while (ctx.measureText(text).width > w - 40 && fs > 18) { fs -= 2; ctx.font = `${fs}px Yomogi, sans-serif`; }
  ctx.fillText(text, SW / 2, y + 60);
  ctx.restore();
  ctx.font = '16px Yomogi, sans-serif'; ctx.fillStyle = '#6b655c'; ctx.textAlign = 'center';
  if (state === 'pose') ctx.fillText(`つかんだ所に画びょう（あと${MAX_PINS - pins.length}本）。ポーズができたら「コマを撮る」`, SW / 2, y + h + 26);
  if (frames.length > 1 && state !== 'pose') ctx.fillText(`コマ ${curFrame() + 1} / ${frames.length}`, SW / 2, y + h + 26);
}
function drawTimer() {
  if (!timerOn) return;
  const x = 905, y = 70, r = 46, total = state === 'answer' ? ANSWER_SEC : POSE_SEC, f = Math.max(0, timeLeft / total);
  sketch(circlePts(r, 16).map(([a, b]) => [x + a, y + b]), 85, { fill: SKIN, width: 2.6, amp: 1 });
  ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r - 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.closePath();
  ctx.fillStyle = timeLeft < 5 ? 'rgba(216,67,46,0.25)' : 'rgba(38,34,29,0.08)'; ctx.fill();
  ctx.fillStyle = timeLeft < 5 ? RED : INK; ctx.font = '40px Yomogi, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(timeLeft), x, y + 2);
}
function drawFilmstrip() { // 撮ったコマの数（左上）
  if (state !== 'pose') return;
  ctx.font = '18px Yomogi, sans-serif'; ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('コマ', 40, 40);
  for (let k = 0; k < MAX_FRAMES; k++) {
    const x = 90 + k * 34, y = 28;
    sketch([[x, y], [x + 1, y], [x + 25, y], [x + 26, y], [x + 26, y + 1], [x + 26, y + 23], [x + 26, y + 24], [x + 25, y + 24], [x + 1, y + 24], [x, y + 24], [x, y + 23], [x, y + 1]],
      300 + k, { fill: k < frames.length ? INK : SKIN, width: 2, amp: 0.6, twice: false });
  }
}
const curFrame = () => frames.length ? Math.floor((performance.now() - playStart) / FRAME_MS) % frames.length : 0;
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * ox, DPR * oy);
  drawRoom();
  if (state === 'pose' || state === 'title' || state === 'choose') {
    if (state === 'pose' && frames.length) { ctx.globalAlpha = 0.18; drawView(frames[frames.length - 1]); ctx.globalAlpha = 1; } // 前のコマを薄く
    drawView(liveView());
    if (drag && !drag.body.isProp) { const bp = drag.body.position, o = drag.c.pointB; drawTack({ x: bp.x + o.x, y: bp.y + o.y }, 0.5); }
  } else if (frames.length) drawView(frames[curFrame()]);
  drawOdaiCard(); drawTimer(); drawFilmstrip();
  if (flash > 0) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 答え合わせ ----------
function norm(t) {
  return String(t).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s!?！？、。・,.「」~〜]/g, '');
}
function isRight(guess, o = odai) {
  const g = norm(guess); if (!g) return false;
  const preset = ODAI.find(x => norm(x[0]) === norm(o.t)); // 用意したお題と同じなら、その言い換えも使う
  const cands = [o.t, ...o.alts, ...(preset ? preset[1].split(',').filter(Boolean) : [])].map(norm).filter(Boolean);
  return cands.some(c => g === c || g.includes(c) || (c.includes(g) && [...g].length >= Math.max(2, Math.ceil([...c].length * 0.6))));
}

// ---------- 画面の流れ ----------
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (sel) => document.querySelector(sel);
function showPanel(html) { panel.innerHTML = html; panel.style.display = 'block'; }
function hidePanel() { panel.style.display = 'none'; }
function setBar(html) { bar.innerHTML = html; layout(); }

function goTitle() {
  state = 'title'; timerOn = false; reveal = false; frames = []; face = 'happy'; buildWorld();
  history.replaceState(null, '', location.pathname);
  showPanel(`<h1>なんのポーズ？</h1>
    <p class="sub">ぐにゃぐにゃ人形をコマ撮りで動かして、お題を伝える。<br>作った動きはリンクで友達に出題できる。</p>
    <div class="row"><button class="btn red" id="go">出題する</button></div>
    <p class="sub" style="margin-top:12px">${POSE_SEC}秒で最大${MAX_FRAMES}コマ → 相手は${ANSWER_SEC}秒以内に一言で当てる</p>
    <a class="home" href="../">← BLOCKYCLAW</a>`);
  setBar(''); $('#go').onclick = goChoose;
}
function goChoose() {
  state = 'choose'; frames = []; face = 'normal'; buildWorld(); timerOn = false;
  history.replaceState(null, '', location.pathname);
  const picks = []; while (picks.length < 3) { const k = Math.floor(Math.random() * ODAI.length); if (!picks.includes(k)) picks.push(k); }
  showPanel(`<p class="big">お題を書く</p>
    <form id="of" style="display:grid;gap:8px;margin-top:8px">
      <input class="guess" id="ot" maxlength="20" autocomplete="off" placeholder="例：寝起きのライオン" style="width:auto">
      <input class="guess" id="oa" maxlength="40" autocomplete="off" placeholder="別の言い方（なくてもOK）例：ライオン,らいおん" style="width:auto;font-size:15px">
      <button class="btn red">これでスタート（${POSE_SEC}秒）</button>
    </form>
    <p class="sub" style="margin-top:10px">思いつかないときは：</p>
    <div class="row" style="margin-top:4px">${picks.map(k => `<button class="btn" style="font-size:15px;padding:4px 10px" data-k="${k}">${esc(ODAI[k][0])}</button>`).join('')}</div>`);
  setBar('');
  panel.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { $('#ot').value = ODAI[Number(b.dataset.k)][0]; $('#ot').focus(); });
  $('#of').onsubmit = (e) => {
    e.preventDefault();
    const t = $('#ot').value.trim(); if (!t) { $('#ot').focus(); return; }
    goPose({ t, alts: $('#oa').value.split(/[,、，]/).map(x => x.trim()).filter(Boolean) });
  };
  $('#ot').focus();
}
function goPose(o) {
  state = 'pose'; odai = o; timeLeft = POSE_SEC; timerOn = true; frames = []; hidePanel();
  setBar(`<div class="row faces">${FACES.map(([f, n]) => `<button class="btn ${f === face ? 'on' : ''}" data-f="${f}">${n}</button>`).join('')}</div>
    <div class="row"><button class="btn red" id="shot">コマを撮る（0/${MAX_FRAMES}）</button><button class="btn" id="done" disabled>できた！</button><button class="btn" id="unpin">画びょう全部ぬく</button></div>`);
  bar.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { face = b.dataset.f; bar.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x.dataset.f === face)); });
  $('#shot').onclick = shoot; $('#done').onclick = finishPose;
  $('#unpin').onclick = () => pins.slice().forEach(removePin);
}
function shoot() {
  if (state !== 'pose' || frames.length >= MAX_FRAMES) return;
  frames.push(snapshot()); flash = 0.7;
  $('#shot').textContent = `コマを撮る（${frames.length}/${MAX_FRAMES}）`; $('#done').disabled = false;
  if (frames.length >= MAX_FRAMES) finishPose();
}
function finishPose() {
  if (state !== 'pose') return;
  if (!frames.length) frames.push(snapshot()); // 1コマも撮らずに時間切れ → 今の形を1コマに
  timerOn = false; drag = null; state = 'done'; playStart = performance.now();
  const link = GAME_URL + '#p=' + encodeFrames();
  setBar(`<div class="row"><button class="btn red" id="xq">𝕏で出題する</button><button class="btn" id="local">この端末で友達に出す</button></div>
    <div class="row"><button class="btn" id="copy">リンクをコピー</button><button class="btn" id="again">もう一回</button></div>`);
  $('#xq').onclick = () => {
    const q = new URLSearchParams({ text: `この動き、なんのお題？🤸\n${ANSWER_SEC}秒で当てられる？\n#なんのポーズ`, url: link });
    window.open('https://twitter.com/intent/tweet?' + q.toString(), '_blank', 'noopener');
  };
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(link); $('#copy').textContent = 'コピーした！'; } catch { prompt('このリンクを送ってね', link); } };
  $('#local').onclick = () => goAnswerIntro(true);
  $('#again').onclick = goChoose;
}
function goAnswerIntro(local) {
  state = 'answer'; reveal = false; timerOn = false; timeLeft = ANSWER_SEC; tries = []; setBar('');
  showPanel(`<p class="big">${local ? '友達にわたしてね' : 'この動き、なんのお題？'}</p>
    <p class="sub">${frames.length}コマのパラパラ漫画を見て、${ANSWER_SEC}秒以内に一言で答える。<br>何回答えてもOK。時間がたつとヒントが出る。</p>
    <div class="row"><button class="btn red" id="start">スタート</button></div>
    ${local ? '' : '<p class="sub" style="margin-top:10px"><a class="home" href="#" id="mine">答えずに自分も出題する</a></p>'}`);
  $('#start').onclick = startAnswer;
  if (!local) $('#mine').onclick = (e) => { e.preventDefault(); goChoose(); };
}
function startAnswer() {
  hidePanel(); answerDone = false; playStart = performance.now();
  setBar(`<div class="tries" id="tries"></div>
    <form class="row" id="f"><input class="guess" id="g" autocomplete="off" placeholder="一言で答える"><button class="btn red">答える</button></form>`);
  $('#f').onsubmit = (e) => { e.preventDefault(); const v = $('#g').value.trim(); if (!v) return; $('#g').value = ''; guess(v); };
  $('#g').focus();
  timeLeft = ANSWER_SEC; timerOn = true; answerStartAt = performance.now();
}
function guess(v) {
  if (answerDone) return;
  if (isRight(v)) return endAnswer(true);
  tries.push(v); $('#tries').innerHTML = tries.slice(-5).map(t => `<s>${esc(t)}</s>`).join('');
}
function endAnswer(ok) {
  if (answerDone) return; answerDone = true; timerOn = false; reveal = true;
  const t = (performance.now() - answerStartAt) / 1000;
  const rank = !ok ? '' : t < 5 ? '以心伝心' : t < 12 ? 'なかなかの読み' : 'ギリギリ伝わった';
  const msg = ok ? `正解！ ${t.toFixed(1)}秒` : `時間切れ！ 正解は「${esc(odai.t)}」`;
  const shareText = ok ? `「なんのポーズ？」に${t.toFixed(1)}秒で正解した！【${rank}】\nあなたも当ててみて👇\n#なんのポーズ`
    : `「なんのポーズ？」わからなかった…\nあなたは当てられる？👇\n#なんのポーズ`;
  const link = GAME_URL + '#p=' + encodeFrames();
  setBar(`<div class="row" style="font-size:24px;align-items:baseline;gap:12px">${msg}${rank ? `<span style="font-size:18px">【${rank}】</span>` : ''}</div>
    <div class="row"><button class="btn red" id="mine">自分も出題する</button><button class="btn" id="xs">𝕏で言う</button></div>`);
  $('#mine').onclick = goChoose;
  $('#xs').onclick = () => { const q = new URLSearchParams({ text: shareText, url: link }); window.open('https://twitter.com/intent/tweet?' + q.toString(), '_blank', 'noopener'); };
}

// ---------- ループ ----------
let last = 0;
function loop(t) {
  const dt = Math.min(t - last, 33); last = t;
  if (state === 'pose' || state === 'title' || state === 'choose') Engine.update(engine, dt);
  boil = Math.floor(t / 130); flash = Math.max(0, flash - dt / 250);
  if (timerOn) {
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) { timeLeft = 0; if (state === 'pose') finishPose(); else if (state === 'answer') endAnswer(false); }
  }
  draw(); requestAnimationFrame(loop);
}
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const reserve = bar.offsetHeight ? bar.offsetHeight + 20 : 16;
  s = Math.min(W / SW, (H - reserve) / SH); ox = (W - SW * s) / 2; oy = Math.max(0, (H - reserve - SH * s) / 2);
}
addEventListener('resize', layout);
function start() {
  if (!innerWidth || !innerHeight) { setTimeout(start, 100); return; }
  makeGrain(); layout();
  const m = location.hash.match(/#p=([A-Za-z0-9_.~\-]+)/), d = m && decodeFrames(m[1]);
  if (d) { buildWorld(); odai = d.odai; frames = d.frames; goAnswerIntro(false); } else goTitle();
  last = performance.now(); requestAnimationFrame(loop);
}
start();
window.__pose = { get frames() { return frames; }, get state() { return state; }, encodeFrames, decodeFrames, isRight, get parts() { return parts; }, shoot, finishPose };
</script>
