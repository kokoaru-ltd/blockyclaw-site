// ---- the whole world is this shader: a distance function, procedural concrete, lamps, a torch and a body-camera lens
const sh=dv.createShaderModule({code:`
struct U{r:vec4f,p:vec4f,a:vec4f,e:array<vec4f,8>,ta:vec4f,tb:vec4f,w:vec4f,e2:array<vec4f,8>}
@group(0)@binding(0)var<uniform>u:U;
@vertex fn v(@builtin(vertex_index)i:u32)->@builtin(position)vec4f{return vec4f(f32(i&1u)*4.-1.,f32(i>>1u)*4.-1.,0.,1.);}
fn h2(p:vec2f)->f32{return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5);}
fn h3(p:vec3f)->f32{return fract(sin(dot(p,vec3f(127.1,311.7,74.7)))*43758.5);}
fn vn(p:vec3f)->f32{let i=floor(p);var f=fract(p);f=f*f*(3.-2.*f);

fn bx(p:vec3f,b:vec3f)->f32{let q=abs(p)-b;return length(max(q,vec3f(0.)))+min(max(q.x,max(q.y,q.z)),0.);}
fn cap(p:vec3f,a:vec3f,b:vec3f,r:f32)->f32{let pa=p-a;let ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.))-r;}
// static world: floor, ceiling, outer walls, pillars, ceiling beams, lamp tubes
// what stands in an 8 m bay is decided by k = (3x+5z) mod 7 of the bay: +x side car (k<3) or container (k=4),
// -x side a concrete barrier (k odd) or a stack of crates (k even). bays crossed by a partition wall keep the +x side free
fn bk(ci:vec2f)->f32{let k=floor(fract((ci.x*3.+ci.y*5.)/7.)*7.+.5);return k-7.*step(6.5,k);}
fn obs(p:vec3f)->f32{

  var d=4.6-max(abs(c.x),abs(c.y));

    if(k<2.5){
      let q=vec3f(c.x-2.4,p.y,c.y);
      let tp=1.+max(q.y-.8,0.)*.9;var b=bx(q-vec3f(0.,.5,0.),vec3f(.66,.17,1.86))-.22;

    d=min(d,bx(q-vec3f(0.,.4,0.),vec3f(1.3,.4,.1+.2*clamp(1.-q.y*2.,0.,1.)))*.7);

    d=min(d,min(bx(q-vec3f(0.,.5,0.),vec3f(.49)),min(bx(q-vec3f(.9,.35,.2),vec3f(.34)),bx(q-vec3f(.1,1.3,0.),vec3f(.29))))-.01);}

// the map is 24 m blocks between the partition walls. one block in three is an open yard under the night sky:
// no roof, pillars or lamps, lit by the moon
const MOON=vec3f(.42,.84,.34);
fn yd(x:vec2f)->f32{let b=floor((x+12.)/24.);return step(abs(fract((b.x+2.*b.y)/3.)-.333),.1);}
fn wm(p:vec3f)->f32{

  d=min(d,obs(p));
  d=min(d,min(bx(vec3f(abs(wl.x)-.2,p.y-2.75,wo.x),vec3f(.03,.11,.38)),bx(vec3f(wo.y,p.y-2.75,abs(wl.y)-.2),vec3f(.38,.11,.03))));

    let q=abs(c)-.45;d=min(d,max(length(max(q,vec2f(0.)))+min(max(q.x,q.y),0.)-.05,p.y-3.4));

    let l=(fract(p.xz/8.+.5)-.5)*8.;

// other players: helmet, torso, legs, arms holding a rifle (e.xyz feet, e.w yaw)
fn em(p:vec3f)->f32{var d=1e3;for(var i=0;i<8;i++){let e=u.e[i];if(e.y>-50.){let w=p-e.xyz;let r=length(w-vec3f(0.,.9,0.));
  if(r>1.5){d=min(d,r-1.2);}else{let sy=sin(e.w);let cy=cos(e.w);let q=vec3f(w.x*cy+w.z*sy,w.y,w.x*sy-w.z*cy);let m=vec3f(abs(q.x),q.y,q.z);
    var s=length((q-vec3f(0.,1.6,.02))*vec3f(1.,.9,.9))-.125;
    s=min(s,bx(q-vec3f(0.,1.18,0.),vec3f(.16,.24,.08))-.07);
    let mv=u.e2[i].y;let lw=sin(u.e2[i].x)*sign(q.x)*mv;   // legs swing opposite to each other, the lifted foot bends the knee

    s=min(s,min(cap(m,vec3f(.1,.85,0.),kn,.085),cap(m,kn,ft,.075)));
    s=min(s,cap(m,vec3f(.26,1.4,0.),vec3f(.2,1.18,.18),.06));
    s=min(s,cap(m,vec3f(.2,1.18,.18),vec3f(.05,1.3,.42),.05));
    s=min(s,bx(q-vec3f(.04,1.33,.5),vec3f(.018,.03,.34)));
    s=min(s,bx(q-vec3f(.04,1.24,.38),vec3f(.014,.07,.025)));
    d=min(d,s);}}}return d;}
fn mp(p:vec3f)->f32{return min(wm(p),em(p));}
fn nr(p:vec3f)->vec3f{let e=vec2f(.002,0.);return normalize(vec3f(mp(p+e.xyy)-mp(p-e.xyy),mp(p+e.yxy)-mp(p-e.yxy),mp(p+e.yyx)-mp(p-e.yyx)));}
fn mar(ro:vec3f,rd:vec3f,n:i32,mx:f32)->f32{var t=0.;for(var i=0;i<n;i++){let d=mp(ro+rd*t);if(d<.001+.001*t){return t;}t+=d;if(t>mx){break;}}return -1.;}
fn sha(o:vec3f,d:vec3f,mx:f32)->f32{var t=.06;var r=1.;for(var i=0;i<28;i++){let h=mp(o+d*t);r=min(r,10.*h/t);t+=clamp(h,.03,.6);if(h<.002||t>mx){break;}}return clamp(r,0.,1.);}
fn lon(k:vec2f)->f32{var o=step(.3,h2(k))*(1.-yd(k*8.));if(h2(k+3.7)>.75){o*=step(.3,h2(vec2f(floor(u.r.z*13.),k.x+k.y)));}return o;}
fn wet(p:vec3f)->f32{return smoothstep(.5,.6,fb(vec3f(p.xz*.4,3.)));}
fn fw()->vec3f{return vec3f(sin(u.a.x)*cos(u.a.y),sin(u.a.y),-cos(u.a.x)*cos(u.a.y));}
fn shade(p:vec3f,n:vec3f,rd:vec3f)->vec3f{

    let sx=mix(wo.x,wo.y,step(abs(abs(wl.y)-.2),.05));return vec3f(.08,1.,.3)*(.6+1.2*step(abs(sx),.3)*step(.25,fract(sx*5.+.1)));}

  var sw=.04;var sp=16.;
  let c=(fract(p.xz/8.)-.5)*8.;

    alb=vec3f(.15,.15,.16)*(.5+nz)*(.8+.4*vn(p*40.));
    let lx=abs(fract(p.x/2.667)-.5)*2.667;
    alb=mix(alb,vec3f(.5,.5,.46),step(lx,.06)*step(1.3,abs(c.y))*smoothstep(.35,.6,nz+.15));

  }else if(n.y>-.5){
    let s=vn(vec3f(p.x*3.,p.y*.35,p.z*3.));
    alb*=mix(1.,.5,smoothstep(.55,.8,s)*smoothstep(3.2,.8,p.y));
    alb*=mix(.55,1.,smoothstep(0.,.5,p.y));
    if(max(abs(c.x),abs(c.y))<.56&&p.y<1.1){
      alb=mix(vec3f(.7,.55,.06),vec3f(.04),step(.5,fract((p.y+c.x+c.y)*2.)))*(.35+nz)*smoothstep(.3,.5,nz+vn(p*9.)*.3);
      alb=max(alb,vec3f(.05));}
  }else{alb*=.6;}
  if(p.y>2.85&&p.y<3.09&&abs(c.x-1.33)<.26&&abs(c.y)>.33&&n.y>-.95&&yd(p.xz)<.5){alb=mix(vec3f(.22,.07,.04),vec3f(.3,.3,.32),step(1.33,c.x))*(.5+nz);sw=.4;sp=30.;}

        alb=mix(mix(vec3f(.05,.07,.12),vec3f(.3,.3,.31),step(.4,hh)),vec3f(.13,.025,.025),step(.8,hh))*(.6+.6*nz);sw=.6;sp=90.;
        if(q.y>.86&&q.y<1.3&&abs(q.z+.15)<1.02){alb=vec3f(.012);sw=1.;sp=200.;}
        if(q.y<.62&&abs(abs(q.z)-1.3)<.32&&abs(q.x)>.68){alb=vec3f(.02);sw=.05;sp=8.;}
        alb=mix(alb,vec3f(.18,.17,.16)*nz,smoothstep(.5,.9,vn(p*3.)*n.y+.35));
      }else{
        alb=mix(vec3f(.07,.15,.2),vec3f(.3,.11,.05),step(.5,hh))*(.5+.8*nz)*(.72+.28*sin(p.z*42.));sw=.12;sp=20.;
        alb=mix(alb,vec3f(.2,.09,.04)*nz,smoothstep(.5,.72,vn(p*4.)));}
    }else if(fract(k*.5)<.25){
      alb=vec3f(.34,.24,.13)*(.4+.9*nz)*(.55+.45*smoothstep(.02,.05,abs(fract(p.y*5.)-.5)))*(.8+.4*vn(p*vec3f(4.,60.,60.)));sw=.02;}
    else{alb*=mix(vec3f(1.),vec3f(1.,.35,.1),step(.55,p.y)*step(p.y,.68)*smoothstep(.3,.5,nz+.1));}}
  var col=alb*vec3f(.01,.012,.014);
  let k0=floor(p.xz/8.+.5);
  for(var a=0;a<2;a++){for(var b=0;b<2;b++){let k=floor(p.xz/8.)+vec2f(f32(a),f32(b));
    let o=lon(k);if(o>0.){
      let L=vec3f(k.x*8.,3.05,k.y*8.)-p;let d2=dot(L,L);let ld=L/sqrt(d2);
      var s=1.;if(k.x==k0.x&&k.y==k0.y){s=sha(p+n*.02,ld,sqrt(d2)-.25);}
      col+=LC*o*s*7./(1.+d2)*(alb*max(dot(n,ld),0.)+sw*pow(max(dot(reflect(rd,n),ld),0.),sp));}}}
  if(yd(p.xz)>.5){
    col+=vec3f(.3,.4,.6)*.9*sha(p+n*.02,MOON,40.)*(alb*max(dot(n,MOON),0.)+sw*pow(max(dot(reflect(rd,n),MOON),0.),sp))+alb*vec3f(.012,.018,.03)*(.6+.4*n.y);}
  // torch on the chest, and the muzzle flash
  let L=u.p.xyz-p;let d2=dot(L,L);let ld=L/sqrt(d2);
  let cone=smoothstep(.78,.95,dot(-ld,fw()));
  col+=(vec3f(1.,.96,.88)*(cone*26.+.5)+vec3f(1.,.65,.25)*u.r.w*22.)/(1.+d2)*(alb*max(dot(n,ld),0.)+sw*pow(max(dot(reflect(rd,n),ld),0.),sp));
  return col*clamp(mp(p+n*.15)/.15,.25,1.);}
// weapon in two gloved hands, forearms in sleeves; camera space. u.w.x: 0 pistol, 1 rifle, 2 shotgun
// returns distance, material (0 gun, 1 glove, 2 sleeve)
fn gs(q0:vec3f)->vec2f{
  let W=u.w.x;let lg=step(.5,W);
  var q=q0-vec3f(.012+.055*lg,-.125+u.a.w*.012-u.tb.w*.22-.012*lg,.4-u.a.w*.03-.05*lg);
  let a=-u.a.w*.22*(1.-.6*lg);let ca=cos(a);let sa=sin(a);q=vec3f(q.x,q.y*ca-q.z*sa,q.y*sa+q.z*ca);

    gun=min(gun,bx(q-vec3f(0.,-.009,.006),vec3f(.0095,.008,.074))-.002);
    gun=min(gun,max(bx(q-vec3f(0.,.028,-.078),vec3f(.008,.004,.004)),-bx(q-vec3f(0.,.03,-.078),vec3f(.0028,.004,.006))));

  }else if(W<1.5){
    gun=bx(q-vec3f(0.,.008,.07),vec3f(.013,.022,.16))-.002;
    gun=min(gun,cap(q,vec3f(0.,.014,.2),vec3f(0.,.014,.5),.007));
    gun=min(gun,bx(q-vec3f(0.,.042,0.),vec3f(.004,.012,.05)));
    gun=min(gun,bx(q-vec3f(0.,.04,.42),vec3f(.002,.014,.004)));
    let mq=q-vec3f(0.,-.065,.075);gun=min(gun,bx(vec3f(mq.x,mq.y*.94-mq.z*.34,mq.y*.34+mq.z*.94),vec3f(.009,.05,.018))-.002);
    gun=min(gun,bx(q-vec3f(0.,-.006,-.17),vec3f(.011,.022,.08))-.003);
  }else{
    gun=cap(q,vec3f(0.,.02,-.05),vec3f(0.,.02,.52),.011);
    gun=min(gun,cap(q,vec3f(0.,-.004,.05),vec3f(0.,-.004,.42),.011));
    gun=min(gun,bx(q-vec3f(0.,.008,-.02),vec3f(.014,.024,.08))-.002);
    gun=min(gun,bx(q-vec3f(0.,-.008,.22),vec3f(.019,.017,.06))-.004);

  gun=min(gun,max(abs(length(q.yz-vec2f(-.031,-.02))-.016)-.002,abs(q.x)-.004));
  var hd=length((gr-vec3f(.014,.004,-.014))*vec3f(.85,.7,1.))-.033;
  for(var i=0;i<4;i++){let y=.026-f32(i)*.021;
    hd=min(hd,cap(gr,vec3f(-.03,y-.004,.02),vec3f(.03,y,.024),.0098));
    hd=min(hd,cap(gr,vec3f(.03,y,.024),vec3f(.034,y+.003,-.006),.0098));}
  hd=min(hd,cap(q,vec3f(.019,-.012,-.06),vec3f(.0165,-.005,-.012),.0085));
  // left hand: on the grip for the pistol, under the barrel for long guns
  let lp=mix(vec3f(-.022,-.062,-.058),vec3f(-.006,-.04,.22),lg);
  hd=min(hd,length((q-lp)*vec3f(.8,.8,.75))-.032);
  hd=min(hd,cap(q,lp+vec3f(-.012,.03,-.01),lp+vec3f(-.004,.045,.05),.0085));

@fragment fn f(@builtin(position)c:vec4f)->@location(0)vec4f{
