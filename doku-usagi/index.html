<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毒うさぎ命名ゲーム | BLOCKYCLAW</title>
<meta name="description" content="名前のない毒うさぎに名前をつけよう。つけた名前の音に合わせて踊りだす。">
<meta property="og:title" content="毒うさぎ命名ゲーム">
<meta property="og:description" content="名前のない毒うさぎに名前をつけよう。つけた名前の音に合わせて踊りだす。">
<meta property="og:image" content="https://kokoaru-ltd.github.io/blockyclaw-site/thumbs/doku-usagi.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
:root{
  --purple:#9f40f4; --deep:#3a1466; --ink:#1d0b33; --lime:#c8ff3d; --pink:#ff5fb7; --cream:#fff7e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
  color:var(--ink);overflow-x:hidden;background-color:#f6efff;
  background-image:radial-gradient(circle,#e6d8fb 2.5px,transparent 3px),linear-gradient(180deg,#f6efff 0%,#fff3f9 100%);
  background-size:30px 30px,100% 100%;background-attachment:fixed;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:14px 16px 40px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:.06em;}
h1 small{display:block;font-size:11px;color:var(--purple);letter-spacing:.2em;font-weight:400}
.iconbtn{background:#fff;border:2px solid #e0cffa;color:var(--ink);border-radius:999px;
  width:40px;height:40px;font-size:18px;cursor:pointer}

/* ---------- stage ---------- */
#stage{position:relative;height:300px;margin-top:4px;user-select:none}
.spot{position:absolute;left:50%;bottom:6px;width:240px;height:36px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(58,20,102,.28),transparent);border-radius:50%;animation:shadow 2.4s ease-in-out infinite}
@keyframes shadow{50%{transform:translateX(-50%) scale(.93)}}
.chara-pos{position:absolute;left:50%;bottom:0;width:280px;height:280px;margin-left:-140px;transform-origin:50% 92%;cursor:pointer}
.chara-dance,.chara-idle{position:absolute;inset:0;transform-origin:50% 92%}
.chara-idle{animation:idle 2.4s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.972)}}
.chara-idle img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.eye{position:absolute;top:34%;width:4.2%;height:3.8%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;opacity:0}
.eye::after{content:"";position:absolute;left:8%;right:8%;top:42%;height:22%;background:#111;border-radius:99px}
.eye.l{left:44.8%}.eye.r{left:53.9%}
.blink .eye{opacity:1}

.chara-pos.r-super{animation:rSuper 1.5s cubic-bezier(.3,1.4,.5,1)}
.chara-pos.r-joy{animation:rJoy 1.1s ease}
.chara-pos.r-ok{animation:rOk .9s ease}
.chara-pos.r-meh{animation:rMeh 1.3s ease}
.chara-pos.r-hate{animation:rHate .9s linear}
.chara-pos.r-poke{animation:rPoke .5s ease}
.chara-pos.r-think{animation:rThink .8s ease-in-out infinite}
@keyframes rSuper{0%{transform:none}20%{transform:translateY(-34%) rotate(-12deg) scale(.95,1.08)}40%{transform:translateY(0) scale(1.15,.85)}
  60%{transform:translateY(-40%) rotate(372deg)}80%{transform:translateY(0) rotate(360deg) scale(1.15,.85)}100%{transform:rotate(360deg)}}
@keyframes rJoy{0%,100%{transform:none}25%{transform:translateY(-24%) scale(.95,1.08)}45%{transform:scale(1.12,.88)}65%{transform:translateY(-16%)}82%{transform:scale(1.06,.94)}}
@keyframes rOk{0%,100%{transform:none}30%{transform:translateY(4%) scale(1.05,.93)}60%{transform:none}80%{transform:translateY(3%) scale(1.04,.95)}}
@keyframes rMeh{0%,100%{transform:none}30%,70%{transform:rotate(-13deg) translateX(-3%)}}
@keyframes rHate{0%,100%{transform:none}10%,30%,50%,70%,90%{transform:translateX(-5%) rotate(-4deg)}20%,40%,60%,80%{transform:translateX(5%) rotate(4deg)}}
@keyframes rPoke{0%,100%{transform:none}40%{transform:translateY(-12%) scale(.94,1.08)}70%{transform:scale(1.1,.9)}}
@keyframes rThink{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.grumpy .chara-idle img{filter:hue-rotate(-40deg) saturate(.55) brightness(.85)}

#bubble{position:absolute;left:50%;top:0;transform:translateX(-50%) scale(0);transform-origin:50% 100%;
  background:#fff;color:var(--ink);padding:8px 16px;border-radius:18px;font-weight:700;font-size:15px;white-space:nowrap;
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.6,.5,1);z-index:5;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#bubble.show{transform:translateX(-50%) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}

/* ---------- panels ---------- */
.screen{display:none;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.card{background:#fff;border:2px solid #e6d8fb;border-radius:20px;padding:16px;box-shadow:0 6px 0 #e6d8fb;margin-top:12px}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--lime);border:0;border-radius:999px;padding:13px 22px;font-size:16px;cursor:pointer;
  box-shadow:0 5px 0 #6f9a00;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6f9a00}
.btn.big{font-size:20px;padding:16px 34px;width:100%}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #a81a6e;color:#fff}
.btn.pink:active{box-shadow:0 1px 0 #a81a6e}
.btn.dark{background:#111;color:#fff;box-shadow:0 5px 0 #000}
.btn.dark:active{box-shadow:0 1px 0 #000}
.btn.ghost{background:#efe6fc;color:var(--ink);box-shadow:0 5px 0 #d3c0f0}
.btn.sm{padding:8px 14px;font-size:13px;box-shadow:0 3px 0 #6f9a00}
.btn:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.center{text-align:center}
.lead{font-size:14px;line-height:1.7;opacity:.92;margin:6px 0 14px}
.prev{font-size:13px;color:var(--purple);font-weight:700;margin-top:12px}

.tabs{display:flex;gap:8px}
.tab{flex:1;font:inherit;font-weight:700;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer;opacity:.6}
.tab.on{background:#fff;color:var(--ink);opacity:1}
.reels{display:flex;justify-content:center;gap:8px;margin:14px 0}
.reel{width:64px;height:78px;border-radius:14px;background:#fff;color:var(--ink);font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -10px 14px rgba(0,0,0,.18),inset 0 10px 14px rgba(0,0,0,.18),0 4px 0 rgba(0,0,0,.3);overflow:hidden}
.reel.spin span{animation:reel .09s linear infinite}
.reel.stop{animation:reelStop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes reel{from{transform:translateY(-60%);opacity:.3}to{transform:translateY(60%);opacity:.3}}
@keyframes reelStop{from{transform:scale(1.25)}}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.len{font-size:13px;opacity:.85}
.len button{font:inherit;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;margin-left:4px}
.len button.on{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:800}
input[type=text]{font:inherit;font-size:20px;font-weight:800;width:100%;padding:13px 16px;border-radius:14px;border:3px solid #e0cffa;background:#fff;color:var(--ink);text-align:center;outline:none}
input[type=text]:focus{border-color:var(--purple)}

.meterwrap{margin-top:14px;display:none}
.meterwrap.on{display:block}
.meterhead{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.meterhead b{font-size:34px;color:var(--purple);font-variant-numeric:tabular-nums}
.meter{height:16px;border-radius:99px;background:#eee3fb;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7dff6a,var(--lime),#ffe53d,var(--pink));transition:width .1s}
#verdict{font-weight:800;margin-top:8px;min-height:1.4em}
.cands{list-style:none;padding:0;margin:10px 0 0}
.cands li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:2px dashed #e6d8fb;animation:pop .3s}
.cands .n{flex:1;font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cands .s{font-variant-numeric:tabular-nums;color:var(--purple);font-weight:800}
h2{font-size:14px;margin:0;letter-spacing:.1em;opacity:.85}

/* ---------- ceremony ---------- */
body.cer #app{z-index:41}body.cer .screen,body.cer header{visibility:hidden}
#ceremony{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:flex-start;padding-top:330px;flex-direction:column;color:#fff;background:rgba(8,2,18,.0);transition:background .6s;overflow:hidden}
#ceremony.on{display:flex}
#ceremony.dark{background:rgba(8,2,18,.93)}
.beam{position:absolute;top:-10%;left:50%;width:160vmax;height:160vmax;margin-left:-80vmax;transform-origin:50% 0;pointer-events:none;opacity:0;transition:opacity .5s;
  background:conic-gradient(from 170deg at 50% 0,transparent 0deg,rgba(255,255,255,.2) 8deg,transparent 20deg)}
#ceremony.dark .beam{opacity:1}
.beam.a{animation:beamA 1.3s ease-in-out infinite alternate}
.beam.b{animation:beamA 1.7s ease-in-out infinite alternate-reverse;background:conic-gradient(from 170deg at 50% 0,transparent 0deg,rgba(200,255,61,.22) 8deg,transparent 20deg)}
@keyframes beamA{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
#cerTitle{font-size:22px;letter-spacing:.6em;font-weight:900;color:var(--lime);opacity:0;transition:opacity .5s;margin-right:-.6em}
#ceremony.dark #cerTitle{opacity:1}
#cerName{font-size:min(19vw,110px);font-weight:900;line-height:1.1;text-align:center;padding:0 12px;word-break:break-all;margin:18px 0;min-height:1.2em;
  text-shadow:0 5px 0 var(--purple),0 10px 0 var(--deep),0 0 40px rgba(200,255,61,.6)}
#cerName.q{animation:qq .12s linear infinite}
#cerName.stamp{animation:stamp .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes qq{50%{transform:translateX(4px) rotate(2deg)}}
@keyframes stamp{0%{transform:scale(4) rotate(-18deg);opacity:0}60%{transform:scale(.9) rotate(3deg);opacity:1}}
#cerSub{font-weight:800;font-size:17px;min-height:1.5em;text-align:center}
#flash{position:fixed;inset:0;background:#fff;z-index:60;opacity:0;pointer-events:none}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,4px)}}

/* ---------- result ---------- */
#nameBig{font-size:min(13vw,60px);font-weight:900;text-align:center;line-height:1.2;color:var(--purple);text-shadow:0 4px 0 #e3d2ff;word-break:break-all}
#nameBig span{display:inline-block;transition:transform .12s,color .12s}
#nameBig span.hit{color:var(--pink);transform:translateY(-14px) scale(1.25)}
.type{display:inline-block;background:var(--lime);color:var(--ink);font-weight:900;border-radius:99px;padding:4px 14px;font-size:14px;margin-top:8px}
.recipe{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.recipe span{background:#f4ecff;border-radius:10px;padding:5px 9px;font-size:12px;border:1px solid transparent}
.recipe span b{color:var(--purple);font-size:15px;margin-right:4px}
.recipe span.hit{border-color:var(--purple);background:#e6d8fb}
.stack{display:grid;gap:12px;margin-top:14px}
.note{font-size:12px;opacity:.75;line-height:1.6;margin-top:8px;text-align:center}
@media (prefers-reduced-motion:reduce){.chara-idle,.bubbles i,.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="app">
  <header>
    <h1><small>POISON BUNNY NAMING</small>毒うさぎ命名ゲーム</h1>
    <button class="iconbtn" id="mute" aria-label="音のオンオフ">🔊</button>
  </header>

  <div id="stage">
    <div id="bubble"></div>
    <div class="spot"></div>
    <div class="chara-pos" id="chara">
      <div class="chara-dance" id="dance">
        <div class="chara-idle" id="idle">
          <img id="charaImg" alt="むらさき色の毒うさぎ">
          <div class="eye l"></div><div class="eye r"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TITLE -->
  <section class="screen on" id="sTitle">
    <div class="card center">
      <p class="lead">このコには、まだ名前がない。<br>キミが考えた名前で呼んでみて、<b>なつき度</b>の高い名前をつけてあげよう。</p>
      <button class="btn big pulse" id="start">なまえを考える</button>
      <div class="prev" id="prev"></div>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="sPlay">
    <div class="card">
      <div id="tabFree">
        <input type="text" id="nameIn" maxlength="10" placeholder="なまえを入力（10文字まで）" autocomplete="off">
        <div class="center" style="margin-top:12px"><button class="btn" id="call">呼んでみる</button></div>
      </div>
      <div class="meterwrap" id="meterwrap">
        <div class="meterhead"><span>「<span id="curName"></span>」のなつき度</span><b><span id="scoreNum">0</span>%</b></div>
        <div class="meter"><i id="meterBar"></i></div>
        <div id="verdict"></div>
        <div class="center" style="margin-top:12px"><button class="btn pink big" id="decide" disabled>この名前に決定！</button></div>
      </div>
    </div>
    <div class="card" id="candCard" style="display:none">
      <h2>こうほリスト</h2>
      <ul class="cands" id="cands"></ul>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="sResult">
    <div class="card center">
      <div id="nameBig"></div>
      <div class="type" id="typeLabel"></div>
      <div class="recipe" id="recipe"></div>
      <p class="note">名前の音ひとつひとつが、このコの動きになっているよ。</p>
      <div class="stack">
        <button class="btn big" id="callName">名前をよぶ</button>
        <button class="btn big dark" id="share">𝕏 で命名を報告する</button>
        <button class="btn big ghost" id="save" disabled>🔒 命名書を保存（ポスト後に解放）</button>
        <button class="btn ghost" id="again">名前をつけなおす</button>
      </div>
      <p class="note">ポストには <b>#毒うさぎ命名</b> が入ります。消さずに投稿してね。</p>
    </div>
  </section>
</div>

<div id="ceremony">
  <div class="beam a"></div><div class="beam b"></div>
  <div id="cerTitle">命名式</div>
  <div id="cerName"></div>
  <div id="cerSub"></div>
</div>

/* ============ 画像（白背景を透過に） ============ */
const charaCanvas = document.createElement('canvas');
const srcImg = new Image();
srcImg.onload = () => {
  const w = srcImg.width, h = srcImg.height;
  charaCanvas.width = w; charaCanvas.height = h;
  const c = charaCanvas.getContext('2d'); c.drawImage(srcImg, 0, 0);
  const d = c.getImageData(0, 0, w, h), p = d.data;
  const light = i => p[i*4] > 232 && p[i*4+1] > 232 && p[i*4+2] > 232;
  const seen = new Uint8Array(w*h), st = [];
  const push = i => { if (!seen[i] && light(i)) { seen[i] = 1; st.push(i); } };
  for (let x = 0; x < w; x++) { push(x); push((h-1)*w + x); }
  for (let y = 0; y < h; y++) { push(y*w); push(y*w + w-1); }
  while (st.length) { const i = st.pop(), x = i % w, y = (i - x) / w; p[i*4+3] = 0;
    if (x > 0) push(i-1); if (x < w-1) push(i+1); if (y > 0) push(i-w); if (y < h-1) push(i+w); }
  for (let pass = 0; pass < 2; pass++) { const kill = [];   // 輪郭に残る白いフチを削る
    for (let i = 0; i < w*h; i++) { if (!p[i*4+3] || Math.min(p[i*4], p[i*4+1], p[i*4+2]) < 150) continue; const x = i % w;
      if ((x > 0 && !p[(i-1)*4+3]) || (x < w-1 && !p[(i+1)*4+3]) || (i >= w && !p[(i-w)*4+3]) || (i < w*(h-1) && !p[(i+w)*4+3])) kill.push(i); }
    kill.forEach(i => p[i*4+3] = 0); }
  c.putImageData(d, 0, 0);
  $('#charaImg').src = charaCanvas.toDataURL();
};
srcImg.src = CHARA_SRC;


/* ============ sound ============ */
let AC = null, muted = store.get('dokuMute') === '1';
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; };
function tone(f, d = .12, type = 'square', vol = .07, when = 0, slide = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d = .05, vol = .08, when = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random()*2 - 1) * (1 - i/n);
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g).connect(a.destination); s.start(a.currentTime + when);
}
const sfx = {
  tick: () => tone(880, .04, 'square', .04),
  stop: () => { tone(520, .08, 'triangle', .12); tone(780, .12, 'triangle', .1, .07); },
  good: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .11, i * .09)),
  great: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .2, 'square', .06, i * .08)),
  ok: () => { tone(440, .12, 'triangle', .1); tone(554, .16, 'triangle', .1, .12); },
  meh: () => tone(300, .35, 'sine', .12, 0, -120),
  bad: () => { tone(110, .4, 'sawtooth', .09); tone(104, .4, 'sawtooth', .09); },
  poke: () => tone(rand(500, 900), .09, 'sine', .12, 0, 300),
  drum: sec => { for (let t = 0; t < sec; t += .055) noise(.05, .04 + .08 * (t / sec), t); },
  boom: () => { noise(.5, .25); tone(90, .6, 'sine', .3, 0, -50); },
  fanfare: () => { const n = [[523,.14],[523,.14],[523,.14],[659,.3],[587,.14],[659,.14],[784,.6]]; let t = 0;
    n.forEach(([f, d]) => { tone(f, d + .05, 'square', .07, t); tone(f/2, d + .05, 'triangle', .09, t); t += d + .03; }); },
};
$('#mute').textContent = muted ? '🔇' : '🔊';
$('#mute').onclick = () => { muted = !muted; store.set('dokuMute', muted ? '1' : '0'); $('#mute').textContent = muted ? '🔇' : '🔊'; if (!muted) sfx.poke(); };

/* ============ particles ============ */
const fx = $('#fx'), g2 = fx.getContext('2d'); let parts = [], W = 0, H = 0;
function fit() { const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; fx.width = W*r; fx.height = H*r; g2.setTransform(r,0,0,r,0,0); }
addEventListener('resize', fit); fit();
const COLS = ['#c8ff3d', '#ff5fb7', '#9f40f4', '#fff', '#ffe53d', '#5fe1ff'];
function emit(o) { parts.push(Object.assign({ x: W/2, y: H/2, vx: 0, vy: 0, g: .25, life: 90, age: 0, rot: 0, vr: 0, size: 8, color: '#fff', ch: null, drag: .99 }, o)); if (parts.length > 900) parts.splice(0, parts.length - 900); }
function confetti(n = 120) { for (let i = 0; i < n; i++) emit({ x: rand(0, W), y: rand(-H*.3, -10), vx: rand(-2, 2), vy: rand(2, 7), g: .06, life: rand(140, 240), rot: rand(0, 6), vr: rand(-.3, .3), size: rand(6, 12), color: pick(COLS) }); }
function burst(x, y, n = 50, sp = 8, chs = null) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI*2), s = rand(sp*.3, sp);
  emit({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, g: .09, life: rand(50, 90), size: chs ? rand(16, 30) : rand(3, 6), color: pick(COLS), ch: chs ? pick(chs) : null, drag: .96, vr: rand(-.2, .2) }); } }
function floatUp(x, y, chs, n = 10) { for (let i = 0; i < n; i++) emit({ x: x + rand(-70, 70), y: y + rand(-40, 40), vx: rand(-1, 1), vy: rand(-4, -1.5), g: -.02, life: rand(60, 100), size: rand(18, 32), ch: pick(chs) }); }
function drip(x, y, chs, n = 6) { for (let i = 0; i < n; i++) emit({ x: x + rand(-80, 80), y: y + rand(-60, 0), vx: rand(-.5, .5), vy: rand(0, 2), g: .18, life: rand(50, 80), size: rand(18, 28), ch: pick(chs) }); }
(function loop() {
  g2.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.age < p.life && p.y < H + 60);
  for (const p of parts) {
    p.age++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    g2.save(); g2.globalAlpha = Math.min(1, (p.life - p.age) / 20); g2.translate(p.x, p.y); g2.rotate(p.rot);
    if (p.ch) { g2.font = p.size + 'px sans-serif'; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillText(p.ch, 0, 0); }
    else { g2.fillStyle = p.color; g2.fillRect(-p.size/2, -p.size/3, p.size, p.size*.66); }
    g2.restore();
  }
  requestAnimationFrame(loop);
})();
const charaXY = () => { const r = $('#chara').getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height*.4]; };

function react(cls, ms) { chara.className = 'chara-pos'; void chara.offsetWidth; chara.classList.add(cls); if (ms) setTimeout(() => chara.classList.remove(cls), ms); }
(function blinkLoop() { setTimeout(() => { idle.classList.add('blink'); setTimeout(() => idle.classList.remove('blink'), 130);
  if (Math.random() < .25) setTimeout(() => { idle.classList.add('blink'); setTimeout(() => idle.classList.remove('blink'), 110); }, 260); blinkLoop(); }, rand(1800, 4500)); })();
const POKE = ['…なに。', 'さわると毒うつるよ', 'なまえ、まだ？', 'くすぐったい', 'ぴょん', 'はやく決めて', 'むらさきは毒の色', 'にんじんより名前'];
const POKE_NAMED = n => [`${n}だよ`, `${n}って呼んで`, 'いい名前でしょ', '毒、わけてあげよっか', `${n}、おどる`];
chara.onclick = () => { if (state.busy) return; sfx.poke(); react('r-poke', 500);
  say(state.name ? pick(POKE_NAMED(state.name)) : pick(POKE)); const [x, y] = charaXY(); burst(x, y, 10, 5, ['✨', '💜']); };

/* ============ なつき度 ============ */
const state = { name: store.get('dokuName') || '', score: 0, cur: null, cands: [], busy: false, len: 3, danceToken: 0 };
function scoreOf(name) {
  const k = toKata(name.trim()), h = hash(k);
  if (/ドク|ポイズン|ムラサキ|ウサ|ラビ|バニ/.test(k)) return Math.min(100, 88 + h % 13);
  if (h % 29 === 0) return 100;
  let s = 18 + h % 63;
  s += Math.min(16, (k.match(/[ムプポモミピパ]/g) || []).length * 8);
  const n = [...k].length; if (n >= 2 && n <= 4) s += 6; if (n >= 8) s -= 10;
  return Math.max(3, Math.min(99, s));
}
const TIERS = [
  { min: 95, cls: 'r-super', ms: 1500, sfx: 'great', v: '運命の名前！！ これしかない！', says: ['それ！！！', 'それがいい！！', 'うまれる前からそれだった'] },
  { min: 75, cls: 'r-joy', ms: 1100, sfx: 'good', v: 'かなり気に入ったみたい！', says: ['いいじゃん', 'すき', 'わるくない…いや、いい'] },
  { min: 50, cls: 'r-ok', ms: 900, sfx: 'ok', v: 'まあまあ、アリらしい。', says: ['ふーん', 'まあ、アリ', 'きらいじゃない'] },
  { min: 25, cls: 'r-meh', ms: 1300, sfx: 'meh', v: 'びみょうな顔をしている…', says: ['うーん…', 'それ本気？', 'ほかにない？'] },
  { min: 0, cls: 'r-hate', ms: 900, sfx: 'bad', v: 'いやがっている！ 毒をとばしてきた！', says: ['やだ', 'むり', '毒くらえ'] },
];
const tierOf = s => TIERS.find(t => s >= t.min);

async function evaluate(name) {
  name = name.trim(); if (!name || state.busy) return;
  state.busy = true; stopDance(); document.body.classList.remove('grumpy');
  const score = scoreOf(name), tier = tierOf(score);
  $('#meterwrap').classList.add('on'); $('#curName').textContent = name; $('#decide').disabled = true; $('#verdict').textContent = '…';
  say(`「${name}」…？`, 0); react('r-think');
  const t0 = performance.now(), dur = 1300;
  await new Promise(res => { (function roll(t) { const k = Math.min(1, (t - t0) / dur);
      const v = k < 1 ? Math.floor(rand(0, 100)) : score; $('#scoreNum').textContent = v; $('#meterBar').style.width = v + '%';
      if (k < 1) { if (Math.random() < .35) sfx.tick(); requestAnimationFrame(roll); } else res(); })(t0); });
  react(tier.cls, tier.ms); sfx[tier.sfx](); say(pick(tier.says)); $('#verdict').textContent = tier.v;
  const [x, y] = charaXY();
  if (score >= 95) { burst(x, y, 40, 10, ['💜', '💖', '⭐', '✨']); confetti(90); $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go'); }
  else if (score >= 75) floatUp(x, y, ['💜', '💖', '✨'], 12);
  else if (score >= 50) floatUp(x, y, ['♪', '✨'], 5);
  else if (score >= 25) drip(x, y - 60, ['💧', '💦'], 4);
  else { document.body.classList.add('grumpy'); burst(x, y, 16, 9, ['☠️', '🟣', '💢']); setTimeout(() => document.body.classList.remove('grumpy'), 1800); }
  state.cur = { name, score };
  if (!state.cands.some(c => c.name === name)) { state.cands.unshift({ name, score }); state.cands = state.cands.slice(0, 6); }
  renderCands(); $('#decide').disabled = false; state.busy = false;
}
function renderCands() {
  const ul = $('#cands'); ul.textContent = ''; $('#candCard').style.display = state.cands.length ? '' : 'none';
  for (const c of state.cands) { const li = document.createElement('li');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = c.name;
    const s = document.createElement('span'); s.className = 's'; s.textContent = c.score + '%';
    const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = 'これにする'; b.onclick = () => ceremony(c.name, c.score);
    li.append(n, s, b); ul.appendChild(li); }
}

/* ============ 名前入力 ============ */
const HEAD = [...'ムラパポピモニルクスフミロペブボナチキリヌプメソタドベマユヨノコテ'];
const TAIL = HEAD.concat([...'ンーッャュョンーン']);
$('#call').onclick = () => evaluate($('#nameIn').value);
$('#nameIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) evaluate($('#nameIn').value); });
$('#nameIn').addEventListener('input', () => { if (!state.busy) react('r-ok', 400); });
$('#decide').onclick = () => state.cur && ceremony(state.cur.name, state.cur.score);

/* ============ 名前 → ダンス ============ */
const ROWS = [
  ['アイウエオヴ', 'stretch'], ['カキクケコガギグゲゴ', 'kick'], ['サシスセソザジズゼゾ', 'slide'], ['タチツテトダヂヅデド', 'stomp'],
  ['ナニヌネノ', 'sway'], ['ハヒフヘホ', 'float'], ['パピプペポバビブベボ', 'hop'], ['マミムメモ', 'puni'],
  ['ヤユヨ', 'wave'], ['ラリルレロ', 'spin'], ['ワヲ', 'pop'], ['ン', 'nod'], ['ッ', 'jerk'], ['ー', 'long'],
];
const MOVES = {
  stretch: { label: 'のびる', type: 'のびのび系', kf: d => ['none', 'scale(.88,1.2)', 'none'] },
  kick:    { label: 'キレよくかたむく', type: 'キレキレ系', kf: d => ['none', `rotate(${16*d}deg) translateX(${7*d}%)`, `rotate(${16*d}deg) translateX(${7*d}%)`, 'none'] },
  slide:   { label: 'すべる', type: 'すいすい系', kf: d => ['none', `translateX(${16*d}%) skewX(${-9*d}deg)`, 'none'] },
  stomp:   { label: 'ふみならす', type: 'どすどす系', kf: d => ['none', 'translateY(-8%)', 'scale(1.24,.76)', 'none'] },
  sway:    { label: 'ゆれる', type: 'ゆらゆら系', kf: d => ['none', `rotate(${10*d}deg)`, `rotate(${-6*d}deg)`, 'none'] },
  float:   { label: 'ふわっとうく', type: 'ふわふわ系', kf: d => ['none', 'translateY(-14%) scale(1.04)', 'translateY(-12%) scale(1.04)', 'none'] },
  hop:     { label: 'はねる', type: 'ぴょんぴょん系', kf: d => ['none', 'translateY(-26%) scale(.94,1.1)', 'scale(1.14,.86)', 'none'] },
  puni:    { label: 'ぷにっとつぶれる', type: 'ぷにぷに系', kf: d => ['none', 'scale(1.24,.84)', 'scale(.92,1.1)', 'none'] },
  wave:    { label: 'ひらりとかわす', type: 'ひらひら系', kf: d => ['none', `rotate(${-13*d}deg) translate(${-6*d}%,-7%)`, 'none'] },
  spin:    { label: 'まわる', type: 'くるくる系', kf: d => ['translateY(0) rotate(0)', `translateY(-12%) rotate(${180*d}deg)`, `translateY(0) rotate(${360*d}deg)`] },
  pop:     { label: 'どーんと大きくなる', type: 'どーん系', kf: d => ['none', 'scale(1.32)', 'none'] },
  nod:     { label: 'うなずく', type: 'こくこく系', kf: d => ['none', 'translateY(5%) scale(1.05,.93)', 'none'] },
  jerk:    { label: 'ぴたっと止まる', type: 'ぴたっと系', kf: d => ['none', 'scale(.84)', 'scale(.84)', 'none'] },
  long:    { label: 'びよーんとのびる', type: 'びよーん系', kf: d => ['none', 'scale(1.28,.84)', 'scale(1.28,.84)', 'none'] },
};
const FALLBACK = ['hop', 'spin', 'puni', 'sway', 'kick', 'pop', 'float', 'stomp'];
function moras(name) { const out = [];
  for (const ch of [...name.trim()]) { if (/\s/.test(ch)) continue;
    if (/[ァィゥェォャュョヮぁぃぅぇぉゃゅょゎ]/.test(ch) && out.length) out[out.length - 1].text += ch; else out.push({ text: ch }); }
  out.forEach(m => { const k = toKata(m.text)[0]; const row = ROWS.find(r => r[0].includes(k)); m.move = row ? row[1] : FALLBACK[hash(m.text) % FALLBACK.length]; });
  return out; }
function profile(name) { const ms = moras(name), h = hash(toKata(name)), cnt = {};
  ms.forEach(m => { if (!['nod', 'jerk', 'long'].includes(m.move)) cnt[m.move] = (cnt[m.move] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || (ms[0] && ms[0].move) || 'hop';
  return { ms, beat: 300 + h % 200, base: [262, 294, 330, 349, 392][h % 5], type: MOVES[top].type }; }
const PENTA = [1, 9/8, 5/4, 3/2, 5/3, 2];
function stopDance() { state.danceToken++; danceEl.getAnimations().forEach(a => a.cancel()); document.querySelectorAll('.hit').forEach(e => e.classList.remove('hit')); }
async function dance(name, loops = Infinity) {
  stopDance(); const token = state.danceToken, p = profile(name);
  const spans = [...document.querySelectorAll('#nameBig span')], chips = [...document.querySelectorAll('#recipe span')];
  for (let l = 0; l < loops; l++) {
    for (let i = 0; i < p.ms.length; i++) {
      if (token !== state.danceToken) return;
      const m = p.ms[i], dir = (i + l) % 2 ? -1 : 1;
      danceEl.animate(MOVES[m.move].kf(dir).map(t => ({ transform: t })), { duration: p.beat, easing: 'cubic-bezier(.3,1.3,.5,1)' });
      tone(p.base * PENTA[hash(m.text) % PENTA.length], p.beat / 1000 * .8, 'triangle', .09);
      spans.forEach((s, j) => s.classList.toggle('hit', j === i)); chips.forEach((s, j) => s.classList.toggle('hit', j === i));
      if (m.move === 'hop' || m.move === 'stomp') { const r = chara.getBoundingClientRect(); setTimeout(() => token === state.danceToken && burst(r.left + r.width/2, r.bottom - 10, 5, 3), p.beat * .6); }
      await sleep(p.beat);
    }
    spans.forEach(s => s.classList.remove('hit')); chips.forEach(s => s.classList.remove('hit'));
    if (token !== state.danceToken) return;
    await sleep(p.beat * 1.5);
  }
}

/* ============ 命名式 ============ */
async function ceremony(name, score) {
  if (state.busy) return; state.busy = true; stopDance();
  const cer = $('#ceremony'), cn = $('#cerName'), cs = $('#cerSub');
  cn.className = ''; cn.textContent = ''; cs.textContent = ''; cer.classList.add('on'); await sleep(30); cer.classList.add('dark');
  scrollTo(0, 0); document.body.classList.add('cer'); say('…ごくり', 0);
  await sleep(900);
  cs.textContent = 'このコの名前は…'; cn.classList.add('q'); sfx.drum(2.6); react('r-think');
  const chars = [...name]; const t0 = Date.now();
  while (Date.now() - t0 < 2600) { cn.textContent = chars.map(() => pick(TAIL)).join(''); await sleep(70); }
  cn.classList.remove('q'); cn.textContent = name; cn.classList.add('stamp');
  $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
  document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 460);
  sfx.boom(); setTimeout(sfx.fanfare, 250); confetti(220); react('r-super', 1500); say(`${name}！！`, 0);
  cs.textContent = `きょうからキミは「${name}」！`;
  for (let i = 0; i < 7; i++) { setTimeout(() => { burst(rand(W*.15, W*.85), rand(H*.12, H*.5), 46, 9); tone(rand(200, 400), .25, 'sine', .08, 0, -100); }, 400 + i * 380); }
  setTimeout(() => confetti(140), 1600);
  state.name = name; state.score = score; store.set('dokuName', name); store.set('dokuScore', String(score));
  await sleep(3600);
  cer.classList.remove('dark'); await sleep(600); cer.classList.remove('on'); document.body.classList.remove('cer');
  state.busy = false; showResult();
}
function showResult() {
  const name = state.name, p = profile(name);
  const nb = $('#nameBig'); nb.textContent = ''; const rc = $('#recipe'); rc.textContent = '';
  p.ms.forEach(m => { const s = document.createElement('span'); s.textContent = m.text; nb.appendChild(s);
    const c = document.createElement('span'); const b = document.createElement('b'); b.textContent = m.text; c.append(b, MOVES[m.move].label); rc.appendChild(c); });
  $('#typeLabel').textContent = `うごきタイプ：${p.type}`;
  const unlocked = store.get('dokuShared') === name; $('#save').disabled = !unlocked; if (unlocked) $('#save').textContent = '📜 命名書を保存';
  else $('#save').textContent = '🔒 命名書を保存（ポスト後に解放）';
  show('sResult'); say(`${name}のダンス、みて`); dance(name);
}
$('#callName').onclick = async () => { if (state.busy) return; stopDance(); sfx.good(); say('はーい！'); react('r-joy', 1100);
  const [x, y] = charaXY(); floatUp(x, y, ['💜', '♪'], 8); await sleep(1100); dance(state.name); };
$('#again').onclick = () => { stopDance(); state.cur = null; $('#meterwrap').classList.remove('on'); show('sPlay'); say('こんどはどんな名前？'); $('#nameIn').value = ''; $('#nameIn').focus(); };

/* ============ X 共有 ============ */
function shareText() { const p = profile(state.name);
  return `うちの毒うさぎの名前は「${state.name}」に決定！\nなつき度 ${state.score}%／うごきタイプ：${p.type}\n${HASHTAG}`; }
$('#share').onclick = () => {
  const q = new URLSearchParams({ text: shareText() }); if (QUOTE_TWEET_URL) q.set('url', QUOTE_TWEET_URL);
  window.open('https://twitter.com/intent/tweet?' + q.toString(), '_blank', 'noopener');
  store.set('dokuShared', state.name); $('#save').disabled = false; $('#save').textContent = '📜 命名書を保存'; say('ひろめてきて', 2500);
};
$('#save').onclick = () => {
  const c = document.createElement('canvas'); c.width = 900; c.height = 1200; const x = c.getContext('2d');
  x.fillStyle = '#fff7e6'; x.fillRect(0, 0, 900, 1200);
  x.strokeStyle = '#9f40f4'; x.lineWidth = 14; x.strokeRect(34, 34, 832, 1132); x.lineWidth = 3; x.strokeRect(56, 56, 788, 1088);
  x.fillStyle = '#3a1466'; x.textAlign = 'center'; const F = '"Hiragino Mincho ProN","Yu Mincho","BIZ UDPMincho",serif';
  x.font = `700 70px ${F}`; x.fillText('命　名　書', 450, 170);
  if (charaCanvas.width) x.drawImage(charaCanvas, 230, 190, 440, 440);
  let fs = 200; x.font = `900 ${fs}px ${F}`; while (x.measureText(state.name).width > 720 && fs > 40) { fs -= 8; x.font = `900 ${fs}px ${F}`; }
  x.fillStyle = '#1d0b33'; x.fillText(state.name, 450, 800 + fs * .3);
  const p = profile(state.name), d = new Date();
  x.fillStyle = '#3a1466'; x.font = `600 34px ${F}`; x.fillText(`なつき度 ${state.score}%　${p.type}`, 450, 980);
  x.fillText(`${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`, 450, 1040);
  x.fillStyle = '#9f40f4'; x.font = `700 36px ${F}`; x.fillText(HASHTAG, 450, 1105);
  const a = document.createElement('a'); a.download = `毒うさぎ命名書_${state.name}.png`; a.href = c.toDataURL('image/png'); a.click();
};

/* ============ 画面切替 ============ */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
$('#start').onclick = () => { ac(); sfx.good(); show('sPlay'); say('いい名前、たのむよ'); react('r-joy', 1100); $('#nameIn').focus(); };
if (state.name) { state.score = +(store.get('dokuScore') || scoreOf(state.name));
  $('#prev').textContent = `いまの名前：${state.name}`; const b = document.createElement('button'); b.className = 'btn sm'; b.style.marginLeft = '10px'; b.textContent = 'ダンスを見る';
  b.onclick = () => { ac(); showResult(); }; $('#prev').appendChild(b); }
setTimeout(() => say(state.name ? `${state.name}だよ` : 'なまえ、ちょうだい', 2600), 700);
</script>
